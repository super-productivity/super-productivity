name: 'Setup E2E Environment'
description: 'Shared setup for E2E test jobs: Node, npm install, Playwright browsers'

inputs:
  browsers:
    description: 'Space-separated Playwright browsers to install'
    required: false
    default: 'chromium'

runs:
  using: 'composite'
  steps:
    - name: Setup Node Dependencies
      uses: ./.github/actions/setup-deps

    - name: Cache Playwright Browsers
      uses: actions/cache@8b402f58fbc84540c8b491a91e594a4576fec3d7 # v5
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ inputs.browsers }}-${{ hashFiles('package-lock.json') }}

    - name: Install Playwright Browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        BROWSERS: ${{ inputs.browsers }}
      run: npx playwright install --with-deps $BROWSERS

    - name: Install Playwright Dependencies (on cache hit)
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      shell: bash
      env:
        BROWSERS: ${{ inputs.browsers }}
      run: npx playwright install-deps $BROWSERS
