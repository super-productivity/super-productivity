name: 'Setup Node Dependencies'
description: 'Shared setup for jobs that need the root workspace installed: Node 22, npm cache, retried npm install'

# Callers must check out the repository first (the action lives in it).
runs:
  using: 'composite'
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: package-lock.json

    # Use `npm i`, not `npm ci`: the root lockfile's
    # `overrides.app-builder-lib.minimatch` pin is considered out-of-sync by
    # npm 10 (bundled with Node 22). npm i runs Prisma's postinstall, which
    # downloads engine binaries from a CDN; a transient ECONNRESET there fails
    # the whole job. Retry to absorb it.
    - name: Install npm Packages
      uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3
      with:
        timeout_minutes: 10
        max_attempts: 3
        retry_wait_seconds: 20
        command: npm i
