name: iOS Simulator Reminders

# Checks in an iOS Simulator that task reminders fire while the app is
# terminated and which ones survive the 64-pending cap. Manual on purpose:
# a macOS job per push is not worth it. See tools/ios-sim-reminders/run.sh.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-simulator-reminders-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reminders:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version-file: .nvmrc

      # First, so a broken Simulator or UI-test setup fails before the long builds.
      - name: Boot Simulator and build the Allow-tap UI test
        run: tools/ios-sim-reminders/run.sh prepare

      # work around for npm installs from git+https://github.com/johannesjo/J2M.git
      - name: Reconfigure git to use HTTP authentication
        run: >
          git config --global url."https://github.com/".insteadOf
          ssh://git@github.com/

      - name: Get npm cache directory
        id: npm-cache-dir
        run: |
          echo "dir=$(npm config get cache)" >> $GITHUB_OUTPUT

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        id: npm-cache
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-node22-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node22-

      - name: Install npm Packages
        run: npm i

      # Not a production build: the harness seeds data through the store that
      # only non-production builds expose (window.__e2eTestHelpers).
      - name: Build Angular frontend (development)
        run: npm run prebuild && npx ng build --configuration development --output-path=dist

      - name: Sync Capacitor iOS
        run: npm run sync:ios

      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install

      - name: Run the reminder check in the Simulator
        run: tools/ios-sim-reminders/run.sh test

      - name: Upload reports, screenshots and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-simulator-reminders
          path: ${{ runner.temp }}/ios-sim-reminders/out
          if-no-files-found: warn
