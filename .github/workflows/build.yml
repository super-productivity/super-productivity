name: Build All & Release
on:
  push:
    branches: [master, release/*, test/git-actions]
    tags:
      - v*

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
      - name: Generate release body
        env:
          GH_REPOSITORY: ${{ github.repository }}
          GH_REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if echo "$GH_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            PREV_TAG=$(git tag --merged HEAD --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^${GH_REF_NAME}$" | sed -n '1p')
          else
            PREV_TAG=$(git tag --merged HEAD --sort=-v:refname | grep '^v' | grep -v "^${GH_REF_NAME}$" | sed -n '1p')
          fi

          # Contributor attribution was lost when curated notes replaced GitHub's
          # auto-generated ones; pull the generated notes only to extract it.
          GENERATED_NOTES=""
          if [ -n "$PREV_TAG" ]; then
            GENERATED_NOTES=$(gh api "repos/${GH_REPOSITORY}/releases/generate-notes" \
              -f tag_name="$GH_REF_NAME" -f previous_tag_name="$PREV_TAG" --jq .body) \
              || { GENERATED_NOTES=""; echo "Could not fetch generated notes for contributor extraction"; }
          fi
          CONTRIBUTORS=$(printf '%s\n' "$GENERATED_NOTES" \
            | grep -oE ' by @[[:alnum:]-]+(\[bot\])? in https://[^ ]+/pull/[0-9]+$' \
            | sed 's/^ by //;s/ in .*//' | grep -v '\[bot\]$' | sort -fu | paste -sd ' ' -) || true
          NEW_CONTRIBUTORS=$(printf '%s\n' "$GENERATED_NOTES" \
            | awk '/^## New Contributors$/{f=1} /^\*\*Full Changelog/{f=0} f' \
            | sed 's/^## /### /') || true

          {
            cat build/release-notes.md
            if [ -n "$CONTRIBUTORS" ]; then
              echo ""
              echo "### Contributors"
              echo ""
              echo "Thanks to everyone who contributed to this release: $CONTRIBUTORS"
            fi
            if [ -n "$NEW_CONTRIBUTORS" ]; then
              echo ""
              echo "$NEW_CONTRIBUTORS"
            fi
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "**Full Changelog**: https://github.com/${GH_REPOSITORY}/compare/${PREV_TAG}...${GH_REF_NAME}"
            fi
          } > /tmp/release-body.md
      - name: Create Draft Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          prerelease: ${{ contains(github.ref, 'RC') || contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}
          body_path: /tmp/release-body.md

  linux-bin-and-snap-release:
    runs-on: ubuntu-latest
    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
      UNSPLASH_KEY: ${{ secrets.UNSPLASH_KEY }}
      UNSPLASH_CLIENT_ID: ${{ secrets.UNSPLASH_CLIENT_ID }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup Electron build environment
        uses: ./.github/actions/setup-electron-build

      - name: Install npm Packages
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 15
          shell: bash
          # Retry to ride out transient npm registry flakiness. (Since
          # Electron 42 `npm i` no longer downloads the Electron binary;
          # electron-builder fetches its own copy when packaging.)
          command: npm i

      - name: Install Playwright Browsers
        run: |
          npx playwright install --with-deps chromium
          npx playwright install-deps chromium

      - run: npm run env # Generate env.generated.ts

      - name: Lint
        run: npm run lint

      - name: Test Unit
        run: npm run test

      - name: Build Frontend for E2E
        run: npm run buildFrontend:e2e

      - name: Verify Build Output
        run: |
          test -f .tmp/angular-dist/browser/index.html || (echo "Build output missing" && exit 1)
          test -f .tmp/angular-dist/browser/assets/bundled-plugins/api-test-plugin/manifest.json || (echo "Plugin assets missing from build" && exit 1)

      - name: Test E2E
        run: npm run e2e:ci

      - name: 'Upload E2E results on failure'
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2eResults
          path: .tmp/e2e-test-results/**/*.*
          retention-days: 14
          overwrite: true # so a re-run of this job does not fail on the existing artifact

      - name: Build Frontend & Electron
        run: npm run build

      - name: Build/Release Electron app
        if: startsWith(github.ref, 'refs/tags/v')
        uses: johannesjo/action-electron-builder@9ea9e2d991c97668843d57337848e3e2b1ffab3d # v1
        with:
          build_script_name: empty
          github_token: ${{ secrets.github_token }}
          release: true

      - name: Build Electron app
        if: false == startsWith(github.ref, 'refs/tags/v')
        uses: johannesjo/action-electron-builder@9ea9e2d991c97668843d57337848e3e2b1ffab3d # v1
        with:
          build_script_name: empty
          github_token: ${{ secrets.github_token }}
          release: false
          args: '--publish never'

      # electron-builder 26.15.0-26.15.6 only 7z-decompressed the snap template's
      # .tar.7z and shipped the inner .tar verbatim at the snap root, so the
      # desktop-integration scripts command.sh sources were missing and every
      # edge revision failed to start (#9992, electron-builder#10002). The build
      # itself stayed green, so assert on the packaged payload instead.
      - name: Verify snap template was unpacked
        run: |
          set -euo pipefail
          SNAP_FILE=$(find ./.tmp/app-builds -type f -name '*.snap' -print -quit)
          if [ -z "$SNAP_FILE" ]; then
            echo "::error::no .snap produced in .tmp/app-builds"
            exit 1
          fi
          # squashfs-tools is not guaranteed on the runner image, and installing without
          # refreshing apt lists first fails with "Unable to locate package".
          if ! command -v unsquashfs > /dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends squashfs-tools
          fi
          unsquashfs -l "$SNAP_FILE" > "$RUNNER_TEMP/snap-listing.txt"
          for script in desktop-init.sh desktop-common.sh desktop-gnome-specific.sh; do
            grep -qx "squashfs-root/$script" "$RUNNER_TEMP/snap-listing.txt" || {
              echo "::error::$script missing from the snap root -- the template archive was not unpacked"
              grep -E '^squashfs-root/[^/]+$' "$RUNNER_TEMP/snap-listing.txt"
              exit 1
            }
          done

      - name: Normalize snap file name
        if: false == startsWith(github.ref, 'refs/tags/v')
        run: find ./.tmp/app-builds -type f -name '*.snap' -exec sh -c 'x="{}"; mv "$x" ".tmp/app-builds/sp.snap"' \;

      - name: Check for final release tag on this commit
        id: release-tag
        if: false == startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch --force --tags origin 'refs/tags/v*:refs/tags/v*'
          if git tag --points-at HEAD | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "has_final_release_tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_final_release_tag=false" >> "$GITHUB_OUTPUT"
          fi
      # Upload branch builds to edge. Published releases upload the exact
      # GitHub release snap to edge/stable in build-publish-to-snap-on-release.yml.
      # Uses Canonical's official snapcraft container instead of `sudo snap
      # install snapcraft --classic` on the runner, which has been a recurring
      # source of "unable to contact snap store" failures.
      # The container runs snapcraft as a pebble service whose working-dir is
      # hard-coded to /project, so docker's -w flag is ignored — mount the
      # build dir at /project so `snapcraft upload sp.snap` resolves correctly.
      #
      # `upload --release edge` blocks until the store's automated review
      # finishes. That is normally quick -- 78s and 161s on 2026-08-27 -- but
      # it degraded for two weeks (2026-08-14 -> 08-27) to ~15.5h, and the
      # 25-minute timeout this step used to fail on turned that into five
      # consecutive red master runs while edge advanced 4441 -> 4501 anyway.
      # A killed client cannot un-submit the upload: snapcraft posts the
      # channel release together with the binary, so the store releases it
      # when review finishes regardless of what happened to CI.
      #
      # So bound the wait and classify by what the store told us.
      # `Status: processing` prints only once the store has accepted the
      # binary and queued its review, which is exactly the line between
      # "review is slow" (pending) and "the upload never landed" (fail).
      # Only a wait-timeout exit may be pending: any other non-zero exit means
      # the review ran and rejected the snap, or auth/the store failed, and
      # those stay red.
      #
      # Pending is NOT treated as success on its own -- `Verify edge is still
      # advancing` below turns it into a hard failure whenever edge has
      # actually stopped moving. Slow-but-landing stays green; a real freeze
      # reds the build that caused it.
      #
      # Retrying an accepted upload cannot help: the store rejects a re-upload
      # of the same binary on its sha3-384, so attempts 2+ always fail (a retry
      # wrapper here kept master red for a week while hiding that). Re-running
      # is only sound in the failed case, where no revision was created.
      - name: Upload branch snap to edge
        id: snap-upload
        if: false == startsWith(github.ref, 'refs/tags/v') && steps.release-tag.outputs.has_final_release_tag != 'true'
        # Backstop only; the inner `timeout` is what normally bounds the wait.
        timeout-minutes: 15
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        # The snapcraft-rocks image's wrapper already runs `snapcraft "$@"`,
        # so the docker CMD must NOT include a leading `snapcraft` word —
        # that gets passed as the subcommand and snapcraft errors with
        # "no such command 'snapcraft'".
        run: |
          set -o pipefail
          rc=0
          timeout --signal=TERM --kill-after=30s 10m \
            docker run --rm \
              -v "$PWD/.tmp/app-builds:/project" \
              -e SNAPCRAFT_STORE_CREDENTIALS \
              -e SNAPCRAFT_HAS_TTY=true \
              ghcr.io/canonical/snapcraft:8_core24 \
              upload sp.snap --release edge 2>&1 \
            | tee "$RUNNER_TEMP/snap-upload.log" || rc=$?

          if [ "$rc" -eq 0 ] && grep -q "released to 'edge'" "$RUNNER_TEMP/snap-upload.log"; then
            echo "result=released" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 124 = the wait elapsed; 137 = 128+SIGKILL, normally --kill-after
          # (any signal death lands here, but paired with an accepted upload
          # the classification is the same).
          if { [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; } \
            && grep -q 'Status: processing' "$RUNNER_TEMP/snap-upload.log"; then
            echo "result=pending" >> "$GITHUB_OUTPUT"
            echo "::warning::Snap accepted by the store and queued for review; the next step fails the build if edge has stopped advancing."
            exit 0
          fi

          echo "result=failed" >> "$GITHUB_OUTPUT"
          if grep -q 'Status: processing' "$RUNNER_TEMP/snap-upload.log"; then
            echo "::error::snapcraft failed after the store accepted the binary (exit $rc); a revision exists, so re-running is rejected on its sha3-384 -- check the store review queue instead"
          elif [ "$rc" -eq 0 ]; then
            echo "::error::snapcraft exited 0 without reporting a release to edge"
          else
            # Deliberately hedged: a duplicate-binary rejection also lands here
            # with no 'Status: processing' line, and re-running that is futile.
            echo "::error::snapcraft upload failed before the store accepted the binary (exit $rc); re-running is safe unless a previous attempt already uploaded this exact binary"
          fi
          exit 1

      # The gate behind the pending path above. An upload we could not confirm
      # is only acceptable while edge is demonstrably still advancing; if edge
      # has stopped, this is where the build goes red -- on the push that
      # caused it, not in a cron nobody reads.
      #
      # Age the unreleased WORK, not edge itself: edge legitimately sits still
      # through a quiet weekend, so measuring from its release date would
      # alarm on the first commit back from one. Commits older than the
      # current edge release are excluded by design (not by clock skew -- both
      # clocks are UTC), which is near-harmless: a later master build is a
      # superset of an earlier one, so a commit whose own snap never uploaded
      # is covered as soon as any later commit's snap lands.
      #
      # Runs on the failure path too, purely to print the channel table.
      - name: Verify edge is still advancing
        if: ${{ !cancelled() && (steps.snap-upload.outcome == 'failure' || steps.snap-upload.outputs.result == 'pending') }}
        # Generous: curl is 4 attempts x 60s + 3 x 5s backoff = 255s worst
        # case, and a kill here would be a red with no annotation at all.
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
          # Not hardcoded master: this job also runs on release/* and
          # test/git-actions, which upload to edge too.
          BRANCH: ${{ github.ref_name }}
          UPLOAD_RESULT: ${{ steps.snap-upload.outputs.result }}
        run: |
          # -f turns an HTTP >=400 into a failure here rather than a body that
          # python would read as a frozen edge; the `||` covers the rest
          # (timeout, DNS, connection refused), which -f does not see at all.
          curl -fsS --retry 3 --retry-delay 5 --max-time 60 \
            -H 'Snap-Device-Series: 16' \
            'https://api.snapcraft.io/v2/snaps/info/superproductivity' \
            -o "$RUNNER_TEMP/snap-info.json" \
            || { echo "::error::could not reach api.snapcraft.io to check edge"; exit 1; }
          python3 - "$RUNNER_TEMP/snap-info.json" <<'PY'
          import datetime, json, os, subprocess, sys

          # Absorbs a slow review plus a quiet weekend. This assumes review
          # latency stays well under ~40h: it is the unstable variable here
          # (minutes -> 15.5h -> minutes again inside two weeks), and if it
          # approaches the threshold this reds a HEALTHY store. Revisit it
          # against observed latency, not on a red day.
          MAX_STALE = datetime.timedelta(hours=48)


          def fail(message):
              # print, don't sys.exit(str): workflow commands are only reliably
              # parsed on stdout.
              print(message)
              sys.exit(1)


          try:
              with open(sys.argv[1]) as fh:
                  channels = json.load(fh).get("channel-map", [])
          except (OSError, ValueError) as err:
              # A 200 carrying HTML (captive portal, CDN interstitial) gets past
              # curl -f, and a bare traceback here is a red with no annotation.
              fail(f"::error::could not read the snap channel map: {err}")
          amd64 = [e for e in channels if e.get("channel", {}).get("architecture") == "amd64"]

          summary = ["### Snap channel map (amd64)", "", "| Channel | Revision | Version | Released |", "| --- | --- | --- | --- |"]
          for entry in amd64:
              channel = entry["channel"]
              summary.append(
                  f"| {channel['name']} | {entry.get('revision')} "
                  f"| {entry.get('version')} | {channel.get('released-at', '?')[:19]} |"
              )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write("\n".join(summary) + "\n")
          print("\n".join(summary))

          # On the failure path the job is already red for a better reason;
          # the table above is all this step owes it.
          if os.environ.get("UPLOAD_RESULT") != "pending":
              sys.exit(0)

          edge = next(
              (
                  entry
                  for entry in amd64
                  # track too: a versioned track would also carry name 'edge'.
                  if entry["channel"].get("track") == "latest"
                  and entry["channel"]["name"] == "edge"
              ),
              None,
          )
          if edge is None:
              fail("::error::could not read a latest/edge amd64 revision from the channel map")
          if "released-at" not in edge["channel"]:
              fail(f"::error::edge revision {edge.get('revision')} has no released-at")

          released_at = datetime.datetime.fromisoformat(edge["channel"]["released-at"])
          now = datetime.datetime.now(datetime.timezone.utc)
          state = (
              f"edge serves rev {edge['revision']} ({edge['version']}), released "
              f"{released_at.isoformat(timespec='seconds')}"
          )

          # Zulu, not isoformat(): its "+00:00" puts a raw `+` in the query
          # string, which decodes to a space, and the API then ignores `since`
          # and returns the full recent history (measured 2026-08: `+00:00` ->
          # every commit, `%2B00:00` and `.123456Z` -> correct, so it is the
          # `+` and not the microseconds). Re-filter below regardless, so
          # correctness never rests on the API honouring the parameter.
          since = released_at.astimezone(datetime.timezone.utc).replace(microsecond=0)
          # --paginate with --jq emits one value per line across all pages.
          # (--slurp cannot be combined with --jq.)
          probe = subprocess.run(
              [
                  "gh", "api", "--paginate",
                  f"repos/{os.environ['GH_REPOSITORY']}/commits"
                  f"?sha={os.environ['BRANCH']}"
                  f"&since={since.strftime('%Y-%m-%dT%H:%M:%SZ')}&per_page=100",
                  "--jq", ".[].commit.committer.date",
              ],
              capture_output=True,
              text=True,
          )
          if probe.returncode != 0:
              # CalledProcessError drops stderr, which is the only thing that
              # separates a rate limit from a token scope from an outage.
              fail(
                  f"::error::could not read {os.environ['BRANCH']} commits from the "
                  "GitHub API "
                  f"(gh exit {probe.returncode}): {probe.stderr.strip()[:500]}"
              )

          pending = sorted(
              d
              for d in (
                  datetime.datetime.fromisoformat(raw.replace("Z", "+00:00"))
                  for raw in probe.stdout.split()
              )
              if d > released_at
          )
          if not pending:
              print(f"{state}; no newer commits on {os.environ['BRANCH']} -- edge is current.")
              sys.exit(0)

          waiting_h = (now - pending[0]).total_seconds() / 3600
          max_stale_h = MAX_STALE.total_seconds() / 3600
          print(f"{state}; {len(pending)} newer commit(s), oldest waiting {waiting_h:.1f}h.")

          if waiting_h > max_stale_h:
              fail(
                  f"::error::this upload could not be confirmed AND edge has not "
                  f"advanced in {waiting_h:.0f}h -- either the store review is stuck or "
                  f"builds have not been reaching the upload step. Snaps are not "
                  f"reaching users either way. {state}"
              )
          print(f"Unconfirmed but edge is still advancing (oldest wait under {max_stale_h:.0f}h).")
          PY

      #      - run: snapcraft push .tmp/app-builds/sp.snap --release candidate
      #        if: startsWith(github.ref, 'refs/tags/v')
  #      - run: snapcraft promote superproductivity --from-channel latest/edge --to-channel latest/candidate --yes
  #        if: startsWith(github.ref, 'refs/tags/v')

  mac-bin:
    needs: [create-release]
    runs-on: macos-15
    if: startsWith(github.ref, 'refs/tags/v')
    env:
      UNSPLASH_KEY: ${{ secrets.UNSPLASH_KEY }}
      UNSPLASH_CLIENT_ID: ${{ secrets.UNSPLASH_CLIENT_ID }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Echo is Release
        run: echo "IS_RELEASE $IS_RELEASE, ${{ startsWith(github.ref, 'refs/tags/v') }}"
        env:
          IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Setup Electron build environment
        uses: ./.github/actions/setup-electron-build

      # @nx/nx-darwin-arm64 + dmg-license aren't in package.json (npm's
      # optional-dep bug skips them), so install them explicitly, and retry to
      # ride out transient npm registry flakiness. (Since Electron 42 `npm i`
      # no longer downloads the Electron binary; electron-builder fetches its
      # own copy when packaging.)
      - name: Install npm Packages
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 15
          shell: bash
          command: npm install @nx/nx-darwin-arm64 dmg-license && npm i

      - run: 'echo "$PROVISION_PROFILE" | base64 --decode > embedded.provisionprofile'
        shell: bash
        env:
          PROVISION_PROFILE: ${{secrets.dl_provision_profile}}

      - name: Prepare for app notarization
        # Import Apple API key for app notarization on macOS
        run: |
          mkdir -p ~/private_keys/
          echo '${{ secrets.mac_api_key }}' > ~/private_keys/AuthKey_${{ secrets.mac_api_key_id }}.p8

      - run: npm run env # Generate env.generated.ts

      - name: Lint
        run: npm run lint

      # No unit tests here: the suite is platform-independent (Karma/ChromeHeadless,
      # TZ pinned via cross-env) and already runs in PR CI and in the linux job of
      # this same workflow. On macOS it only added ~8min and flaky 2s-timeout
      # failures that blocked the release binary (v18.15.0).

      #      - uses: browser-actions/setup-chrome@v2
      #        id: setup-chrome
      #      - run: |
      #          echo Installed chromium version: ${{ steps.setup-chrome.outputs.chrome-version }}
      #          ${{ steps.setup-chrome.outputs.chrome-path }} --version
      # Disabled because not working atm: https://github.com/super-productivity/super-productivity/actions/runs/5924016145/job/16060737982
      #      - name: Test E2E
      #        run: npm run e2e

      - name: Build Frontend & Electron
        run: npm run build

      - name: Build/Release Electron app
        uses: johannesjo/action-electron-builder@9ea9e2d991c97668843d57337848e3e2b1ffab3d # v1
        with:
          build_script_name: empty
          github_token: ${{ secrets.github_token }}
          mac_certs: ${{ secrets.mac_certs }}
          mac_certs_password: ${{ secrets.mac_certs_password }}
          release: ${{ startsWith(github.ref, 'refs/tags/v') }}
          # macOS notarization API key
        env:
          API_KEY_ID: ${{ secrets.mac_api_key_id }}
          API_KEY_ISSUER_ID: ${{ secrets.mac_api_key_issuer_id }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  windows-bin:
    needs: [create-release]
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      actions: read # Required by SignPath action
      id-token: write # Required for SignPath origin verification
    env:
      UNSPLASH_KEY: ${{ secrets.UNSPLASH_KEY }}
      UNSPLASH_CLIENT_ID: ${{ secrets.UNSPLASH_CLIENT_ID }}

    steps:
      # required because setting via env.TZ does not work on windows
      - name: Set timezone to Europe Standard Time
        uses: szenius/set-timezone@1f9716b0f7120e344f0c62bb7b1ee98819aefd42 # v2.0
        with:
          timezoneWindows: 'W. Europe Standard Time'

      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup Electron build environment
        uses: ./.github/actions/setup-electron-build

      # @nx/nx-win32-x64-msvc isn't in package.json (npm's optional-dep bug
      # skips it), so install it explicitly, and retry to ride out transient
      # npm registry flakiness. (Since Electron 42 `npm i` no longer downloads
      # the Electron binary; electron-builder fetches its own copy when
      # packaging.)
      - name: Install npm Packages
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 15
          shell: bash
          command: npm install @nx/nx-win32-x64-msvc && npm i

      - name: Setup Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2

      - name: Export Chrome path for Karma
        shell: pwsh
        run: echo "CHROME_BIN=${{ steps.setup-chrome.outputs.chrome-path }}" >> $env:GITHUB_ENV

      - run: npm run env # Generate env.generated.ts

      - name: Lint
        run: npm run lint

      - name: Test Unit
        run: npm run test

      - name: Build Frontend & Electron
        run: npm run build

      - name: Build/Release Electron app
        uses: johannesjo/action-electron-builder@9ea9e2d991c97668843d57337848e3e2b1ffab3d # v1
        with:
          build_script_name: empty
          github_token: ${{ secrets.github_token }}
          release: false
          args: '--publish never' # Explicit: don't auto-publish unsigned exe files

      # The universal installer and portable are named identically whether they
      # carry one arch or both, so a silently dropped arm64 pack is invisible in
      # the filename alone. Reintroducing ${arch} in electron-builder.yaml is
      # equally invisible here and doubles what we submit to SignPath, whose
      # size-based yearly quota we already exhausted once. Inspect the payloads
      # as well as the filenames before spending any of it.
      - name: Verify Windows artifact set before signing
        shell: pwsh
        run: |
          $exes = Get-ChildItem -Path .tmp/app-builds -Filter *.exe
          $actual = @($exes | ForEach-Object { $_.Name } | Sort-Object)
          $expected = @('Super-Productivity-Setup.exe', 'superProductivity.exe') | Sort-Object
          Write-Host "Built: $($actual -join ', ')"
          if (Compare-Object $actual $expected) {
            Write-Error "Unexpected Windows artifact set. Expected exactly: $($expected -join ', ')"
            exit 1
          }

          $sevenZip = (Get-Command 7z -ErrorAction Stop).Source
          $requiredPayloads = @('$PLUGINSDIR/app-64.7z', '$PLUGINSDIR/app-arm64.7z')
          foreach ($exe in $exes) {
            $listing = & $sevenZip l -slt -tNsis $exe.FullName
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Could not inspect NSIS payloads in $($exe.Name)"
              exit 1
            }
            $archivePaths = @(
              $listing |
                Where-Object { $_ -like 'Path = *' } |
                ForEach-Object { $_.Substring(7).Replace('\', '/') }
            )
            $missingPayloads = @($requiredPayloads | Where-Object { $_ -notin $archivePaths })
            if ($missingPayloads.Count -gt 0) {
              Write-Error "$($exe.Name) is missing architecture payloads: $($missingPayloads -join ', ')"
              exit 1
            }

            $mb = [math]::Round($exe.Length / 1MB, 1)
            Write-Host "  $($exe.Name): $mb MiB"
          }

      # --- Code signing (must succeed — we never publish unsigned exe files) ---

      - name: Upload unsigned executables for SignPath
        id: upload-unsigned
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-windows-executables
          path: .tmp/app-builds/*.exe
          if-no-files-found: error
          retention-days: 1
          # Artifacts are scoped to the run, not the attempt, and uploading a
          # name that already exists fails. Without this, re-running this job
          # after a signing failure dies here instead of retrying the signing.
          overwrite: true

      - name: Sign Windows executables with SignPath
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: super-productivity
          signing-policy-slug: 'release-signing'
          artifact-configuration-slug: 'github-zip-pe'
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          output-artifact-directory: '.tmp/app-builds-signed/'
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600

      - name: Move signed executables back to build directory
        shell: pwsh
        run: |
          $signed = Get-ChildItem -Path .tmp/app-builds-signed -Filter *.exe -Recurse
          if ($signed.Count -eq 0) {
            Write-Error "No signed executables found in SignPath output directory"
            exit 1
          }
          # Build a map of original filenames for matching
          # SignPath may alter separators in filenames, so we normalize
          # dots, hyphens, and spaces to find the corresponding original file
          $originals = Get-ChildItem -Path .tmp/app-builds -Filter *.exe
          $signed | ForEach-Object {
            $signedName = $_.Name
            $normalizedSigned = $signedName -replace '[.\-\s]', ''
            $match = $originals | Where-Object { ($_.Name -replace '[.\-\s]', '') -eq $normalizedSigned }
            if ($match -is [array]) {
              Write-Error "Ambiguous match for $signedName — matched multiple originals: $($match.Name -join ', ')"
              exit 1
            }
            if ($match) {
              Write-Host "Replacing $($match.Name) with signed version (was: $signedName)"
              Move-Item -Force $_.FullName $match.FullName
            } else {
              Write-Error "No matching original found for signed file: $signedName"
              exit 1
            }
          }
          Write-Host "Final executables:"
          Get-ChildItem -Path .tmp/app-builds -Filter *.exe | Format-Table -AutoSize

      - name: Regenerate blockmaps and generate latest.yml for signed executables
        shell: pwsh
        run: |
          $buildDir = ".tmp/app-builds"
          # Only regenerate blockmaps for NSIS setup files (portables don't use them)
          $setupExes = Get-ChildItem -Path $buildDir -Filter "Super-Productivity-Setup*.exe"

          # Resolve the platform-specific app-builder binary from the lockfile-pinned package
          $appBuilder = node -e "console.log(require('app-builder-bin').appBuilderPath)"

          foreach ($exe in $setupExes) {
            $blockmapPath = "$($exe.FullName).blockmap"
            Write-Host "Regenerating blockmap for $($exe.Name)..."
            $output = & $appBuilder blockmap --input="$($exe.FullName)" --output="$blockmapPath" --compression=gzip
            Write-Host "  blockmap output: $output"
          }

          # Update latest.yml with hashes from signed executables
          # (electron-builder generates it during build, but with hashes of unsigned files)
          node -e "
            const fs = require('fs');
            const path = require('path');
            const yaml = require('js-yaml');
            const crypto = require('crypto');

            const buildDir = '.tmp/app-builds';
            const ymlPath = path.join(buildDir, 'latest.yml');

            function getFileInfo(filePath) {
              const fileBuffer = fs.readFileSync(filePath);
              const info = {
                sha512: crypto.createHash('sha512').update(fileBuffer).digest('base64'),
                size: fileBuffer.length,
              };
              const blockmapPath = filePath + '.blockmap';
              if (fs.existsSync(blockmapPath)) {
                info.blockMapSize = fs.statSync(blockmapPath).size;
              }
              return info;
            }

            if (fs.existsSync(ymlPath)) {
              // Update existing latest.yml (preserves all electron-builder fields)
              const ymlData = yaml.load(fs.readFileSync(ymlPath, 'utf8'));
              if (!ymlData.files || ymlData.files.length === 0) {
                console.error('ERROR: latest.yml has no file entries');
                process.exit(1);
              }
              for (const fileEntry of ymlData.files) {
                const filePath = path.join(buildDir, fileEntry.url);
                if (!fs.existsSync(filePath)) {
                  console.error('ERROR: File referenced in latest.yml not found: ' + fileEntry.url);
                  process.exit(1);
                }
                const info = getFileInfo(filePath);
                Object.assign(fileEntry, info);
                console.log('  Updated ' + fileEntry.url + ': sha512=' + info.sha512.substring(0, 20) + '... size=' + info.size);
              }
              if (ymlData.path) {
                const primary = ymlData.files.find(f => f.url === ymlData.path);
                if (primary) { ymlData.sha512 = primary.sha512; }
              }
              fs.writeFileSync(ymlPath, yaml.dump(ymlData, { lineWidth: -1 }));
              console.log('latest.yml updated with signed file hashes');
            } else {
              // Fallback: generate from scratch if latest.yml was not created
              console.log('No existing latest.yml found, generating from scratch');
              const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
              const setupExes = fs.readdirSync(buildDir)
                .filter(f => f.startsWith('Super-Productivity-Setup') && f.endsWith('.exe'));
              if (setupExes.length === 0) {
                console.error('ERROR: No setup executables found in ' + buildDir);
                process.exit(1);
              }
              const files = setupExes.map(filename => {
                const filePath = path.join(buildDir, filename);
                const info = getFileInfo(filePath);
                console.log('  ' + filename + ': sha512=' + info.sha512.substring(0, 20) + '... size=' + info.size);
                return { url: filename, ...info };
              });
              const primary = files.find(f => f.url === 'Super-Productivity-Setup.exe')
                || files[0];
              const latestYml = {
                version: pkg.version,
                files,
                path: primary.url,
                sha512: primary.sha512,
                releaseDate: new Date().toISOString(),
              };
              fs.writeFileSync(ymlPath, yaml.dump(latestYml, { lineWidth: -1 }));
              console.log('Generated latest.yml for ' + files.length + ' signed executables');
            }
          "

      # Existing website and package-manager manifests still use the old
      # architecture-specific URLs. Byte-for-byte copies preserve those public
      # contracts without submitting duplicate executables to SignPath.
      - name: Create legacy Windows download aliases
        shell: pwsh
        run: |
          $buildDir = '.tmp/app-builds'
          Copy-Item -Force -ErrorAction Stop "$buildDir/Super-Productivity-Setup.exe" "$buildDir/Super-Productivity-Setup-x64.exe"
          Copy-Item -Force -ErrorAction Stop "$buildDir/Super-Productivity-Setup.exe" "$buildDir/Super-Productivity-Setup-arm64.exe"
          Copy-Item -Force -ErrorAction Stop "$buildDir/superProductivity.exe" "$buildDir/superProductivity-x64.exe"
          Copy-Item -Force -ErrorAction Stop "$buildDir/superProductivity.exe" "$buildDir/superProductivity-arm64.exe"

      - name: Verify code signatures
        shell: pwsh
        run: |
          $exeFiles = Get-ChildItem -Path .tmp/app-builds -Filter *.exe
          foreach ($exe in $exeFiles) {
            $sig = Get-AuthenticodeSignature $exe.FullName
            Write-Host "$($exe.Name): $($sig.Status)"
            if ($sig.Status -ne 'Valid') {
              Write-Error "Signature verification failed for $($exe.Name): $($sig.Status)"
              exit 1
            }
          }

      - name: Publish signed Windows binaries to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            .tmp/app-builds/*.exe
            .tmp/app-builds/Super-Productivity-Setup*.blockmap
            .tmp/app-builds/latest*.yml
          draft: true
          prerelease: ${{ contains(github.ref, 'RC') || contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}
