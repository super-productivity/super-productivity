name: Master Web Deploy

# Keeps the development build (test-app.super-productivity.com) on the latest
# master. Reuses the PR preview Cloudflare Pages project; the custom domain
# points at its `master` branch alias.
on:
  push:
    branches: [master]
    # No app change, nothing to redeploy.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

# A newer master push supersedes an in-progress deploy.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  deploy-master:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: preview-deployments

    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node Dependencies
        uses: ./.github/actions/setup-deps

      - name: Generate environment file
        run: npm run env

      - name: Build Frontend for Web
        id: build
        run: npm run buildFrontend:prodWeb

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/browser --project-name=super-productivity-preview --branch=master

      # Lighthouse budget check reuses the prodWeb build above so a second
      # build is not needed. Catches bundle-size overruns on master before
      # they surface as red checks on unrelated PRs (#11709).
      - name: Add swap space for Lighthouse
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile
          sudo fallocate -l 4G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Strip service worker artifacts for Lighthouse
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node ./tools/strip-service-worker-assets.js dist/browser

      - name: Run Lighthouse CI
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          configPath: './tools/lighthouse/.lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true
          runs: 1
          budgetPath: './tools/lighthouse/budget.json'
