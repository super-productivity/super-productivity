name: Master Web Deploy

# Keeps the development build (test-app.super-productivity.com) on the latest
# master. Reuses the PR preview Cloudflare Pages project; the custom domain
# points at its `master` branch alias.
on:
  push:
    branches: [master]
    # No app change, nothing to redeploy.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

# A newer master push supersedes an in-progress deploy.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  deploy-master:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: preview-deployments

    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node Dependencies
        uses: ./.github/actions/setup-deps

      - name: Generate environment file
        run: npm run env

      - name: Build Frontend for Web
        run: npm run buildFrontend:prodWeb

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/browser --project-name=super-productivity-preview --branch=master
