name: Cancel CI of closed PRs

# Closing or merging a PR doesn't cancel its runs: concurrency groups only
# cancel when a newer run joins, and closing starts none. PRs merged before CI
# finished kept whole suites running for up to 3h, blocking open PRs' queues.
on:
  # pull_request_target: fork PRs get a read-only token under pull_request.
  # Safe because this job never checks out PR code.
  pull_request_target:
    types: [closed]

permissions:
  actions: write

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel in-flight runs of the closed PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
          MERGED: ${{ github.event.pull_request.merged }}
        run: |
          set -euo pipefail
          # Master pushes and the nightly re-run CI tests, E2E, sync E2E and
          # CodeQL (build.yml, e2e-scheduled.yml, codeql-analysis.yml), but
          # nothing re-runs these, so after a merge their PR run is the only
          # signal. Keep them.
          keep='[]'
          if [[ "$MERGED" == "true" ]]; then
            keep='["Electron Packaging Smoke Test","Android Native Tests","SuperSync Server Tests"]'
          fi
          for id in $(gh run list --commit "$SHA" --event pull_request --limit 100 \
            --json databaseId,status,workflowName |
            jq -r --argjson keep "$keep" \
              '.[] | select(.status != "completed" and (.workflowName as $n | $keep | index($n) | not)) | .databaseId'); do
            echo "PR #$PR closed (merged: $MERGED): cancelling run $id"
            # A run can finish between listing and cancelling; not fatal.
            gh run cancel "$id" || echo "::warning::Could not cancel run $id of PR #$PR"
          done
