name: Build and Push SuperSync Docker Image

on:
  push:
    branches:
      - master
    paths:
      - '.dockerignore'
      - '.github/workflows/supersync-docker.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'packages/shared-schema/**'
      - 'packages/sync-core/**'
      - 'packages/super-sync-server/**'
  workflow_dispatch:
    inputs:
      no_cache:
        description: 'Build without cache'
        required: false
        type: boolean
        default: true

# Every run publishes the same mutable `latest` tag, so only the newest may push.
concurrency:
  group: supersync-docker-publish
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build and Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            ghcr.io:443
            registry.npmjs.org:443
            objects.githubusercontent.com:443

      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reconfigure git to use HTTP authentication
        run: >
          git config --global url."https://github.com/".insteadOf
          ssh://git@github.com/

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ghcr.io/super-productivity/supersync
          tags: |
            type=raw,value=latest
            type=sha,prefix={{branch}}-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Resolve image source revision
        id: source-ref
        shell: bash
        run: |
          revision="$(git log -1 --format=%H -- \
            .dockerignore \
            .github/workflows/supersync-docker.yml \
            package.json \
            package-lock.json \
            packages/shared-schema \
            packages/sync-core \
            packages/super-sync-server)"
          if [ -z "$revision" ]; then
            echo "Could not resolve SuperSync image source revision" >&2
            exit 1
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./packages/super-sync-server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VCS_REF=${{ steps.source-ref.outputs.revision }}
          no-cache: ${{ github.event_name == 'workflow_dispatch' && inputs.no_cache || false }}
          platforms: linux/amd64
          # Buildx would otherwise attach a provenance attestation, turning every push
          # into an OCI index with an untagged child version. Nobody consumes the
          # attestation (deploys verify the VCS_REF revision label instead), and a flat
          # one-version-per-build graph is what makes the prune step below safe.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: echo "Image pushed with digest ${{ steps.meta.outputs.tags }}"

      # Keep the registry from accumulating a version per master push forever. 15
      # newest versions ≈ weeks of rollback targets at the current push cadence.
      # Safe to count naively because the build is single-arch with provenance off:
      # one version per build, no untagged children a deletion could orphan.
      # Requires the package to grant this repo write access (it does — this same
      # workflow publishes it with GITHUB_TOKEN).
      - name: Prune old package versions
        if: github.event_name == 'push'
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5
        with:
          package-name: supersync
          package-type: container
          min-versions-to-keep: 15
