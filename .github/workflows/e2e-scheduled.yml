name: 'E2E Tests (Scheduled)'

on:
  schedule:
    - cron: '0 2 * * *' # 2 AM UTC daily

  workflow_dispatch:
    inputs:
      grep:
        description: 'Playwright --grep filter for the SuperSync job (default: @supersync)'
        required: false
        type: string
        default: '@supersync'
      webdav_grep:
        description: 'Playwright --grep filter for the WebDAV job (default: @webdav)'
        required: false
        type: string
        default: '@webdav'
      webdav_format:
        description: 'Format for generic WebDAV tests (explicit per-case formats are preserved)'
        required: false
        type: choice
        default: v2
        options:
          - v2
          - v3
      run_webdav:
        description: 'Run the WebDAV job (uncheck to skip it instead of passing a no-match grep)'
        required: false
        type: boolean
        default: true
      run_released_clients:
        description: 'Run the released-client job (published app bundles against the current build and server; ignores grep)'
        required: false
        type: boolean
        default: true

  push:
    branches: [master, release/*]
    paths:
      - 'src/app/imex/sync/**'
      - 'src/app/op-log/**'
      - 'src/app/pfapi/**'
      - 'src/app/root-store/**'
      - 'src/app/features/*/store/**'
      - 'src/app/features/tasks/task-attachment/**'
      - 'src/app/plugins/store/**'
      - 'src/app/core/date/date.service.ts'
      - 'src/app/core/util/**'
      - 'src/app/util/get-db-date-str.ts'
      - 'src/app/util/is-today.util.ts'
      - 'src/app/util/start-of-next-day.util.ts'
      - 'src/app/util/local-actions.token.ts'
      - 'src/app/util/skip-during-sync*.operator.ts'
      - 'src/app/util/wait-for-sync-window.operator.ts'
      - 'e2e/tests/**'
      - 'docker-compose.yaml'
      - 'docker-compose.supersync.yaml'
      - 'packages/sync-providers/**'
      - 'packages/sync-core/**'
      - 'packages/super-sync-server/**'
      - 'packages/shared-schema/**'

permissions:
  contents: read

# Each run is ~200 runner minutes. Pushes to one branch share a group without
# cancel-in-progress: the running run finishes and a newer push replaces the
# queued one (shown as cancelled), so a merge burst tests only the running and
# the newest commit, a superset of the skipped ones. Scheduled and manual runs
# get their own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  # Job 0: Build frontend once and share artifact
  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UNSPLASH_KEY: ${{ secrets.UNSPLASH_KEY }}
      UNSPLASH_CLIENT_ID: ${{ secrets.UNSPLASH_CLIENT_ID }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup E2E Environment
        uses: ./.github/actions/setup-e2e

      - run: npm run env

      - name: Build Frontend for E2E
        run: npm run buildFrontend:e2e

      - name: Verify Build Output
        run: |
          test -f .tmp/angular-dist/browser/index.html || (echo "Build output missing" && exit 1)
          test -f .tmp/angular-dist/browser/assets/bundled-plugins/api-test-plugin/manifest.json || (echo "Plugin assets missing from build" && exit 1)

      - name: Upload Build Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-build-${{ github.run_id }}
          path: .tmp/angular-dist
          retention-days: 1

  # Job 1: Regular E2E tests (excludes WebDAV and SuperSync)
  # Skipped on push: PR CI already ran this suite, and build.yml runs the same
  # `npm run e2e:ci` on master and release/* pushes.
  e2e-regular:
    name: E2E Tests (Regular)
    needs: [build]
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UNSPLASH_KEY: ${{ secrets.UNSPLASH_KEY }}
      UNSPLASH_CLIENT_ID: ${{ secrets.UNSPLASH_CLIENT_ID }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup E2E Environment
        uses: ./.github/actions/setup-e2e

      - name: Download Build Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          name: e2e-build-${{ github.run_id }}
          path: .tmp/angular-dist

      - name: Run Regular E2E Tests
        run: npm run e2e:ci

      - name: Upload E2E Results on Failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-results-regular-${{ github.run_id }}
          path: .tmp/e2e-test-results/**/*.*
          retention-days: 30

  # Job 2: WebDAV E2E tests
  e2e-webdav:
    name: E2E Tests (WebDAV ${{ inputs.webdav_format || 'v2' }})
    needs: [build]
    # Skip the job outright rather than handing it a no-match grep: Playwright
    # exits 1 on "No tests found", which reds the whole run. `inputs` is empty
    # for schedule/push, so gate on the event first.
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_webdav }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UNSPLASH_KEY: ${{ secrets.UNSPLASH_KEY }}
      UNSPLASH_CLIENT_ID: ${{ secrets.UNSPLASH_CLIENT_ID }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup E2E Environment
        uses: ./.github/actions/setup-e2e

      - name: Download Build Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          name: e2e-build-${{ github.run_id }}
          path: .tmp/angular-dist

      - name: Create .env file for Docker Compose
        run: |
          cp .env.example .env

      - name: Start WebDAV Docker Service
        # Retry to survive transient Docker Hub pull timeouts / rate limits
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3
        with:
          timeout_minutes: 6
          max_attempts: 3
          retry_wait_seconds: 20
          command: |
            docker compose up -d --build webdav-e2e
            chmod +x ./scripts/wait-for-webdav.sh
            ./scripts/wait-for-webdav.sh

      - name: Run WebDAV E2E Tests
        env:
          E2E_REQUIRE_WEBDAV: 'true'
          E2E_WEBDAV_FORMAT: ${{ inputs.webdav_format || 'v2' }}
          # via env, not interpolated into the script, so a quote in the filter can't break the shell
          E2E_GREP: ${{ inputs.webdav_grep || '@webdav' }}
        run: npm run e2e:all -- --grep "$E2E_GREP"

      - name: Print Docker Logs on Failure
        if: ${{ failure() }}
        run: |
          echo "=== WebDAV Logs (last 400 lines) ==="
          docker compose logs --tail=400 webdav-e2e

      - name: Stop Docker Services
        if: always()
        run: |
          docker compose down

      - name: Upload E2E Results on Failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-results-webdav-${{ github.run_id }}
          path: .tmp/e2e-test-results/**/*.*
          retention-days: 30

  # Job 3: SuperSync E2E tests (sharded). WebDAV runs in every shard as well so
  # the provider-switch scenarios are part of the suite rather than skipped.
  e2e-supersync:
    name: E2E Tests (SuperSync ${{ matrix.shard }}/6)
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      UNSPLASH_KEY: ${{ secrets.UNSPLASH_KEY }}
      UNSPLASH_CLIENT_ID: ${{ secrets.UNSPLASH_CLIENT_ID }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup E2E Environment
        uses: ./.github/actions/setup-e2e

      - name: Download Build Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          name: e2e-build-${{ github.run_id }}
          path: .tmp/angular-dist

      - name: Create .env file for Docker Compose
        run: |
          cp .env.example .env

      - name: Start Sync Docker Services
        # Retry to survive transient Docker Hub pull / Alpine mirror failures.
        # set -eu fails an attempt as soon as the build fails; without it the
        # health wait spun until timeout_minutes, burning the job's time budget.
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3
        with:
          timeout_minutes: 6
          max_attempts: 3
          retry_wait_seconds: 60
          command: |
            set -eu
            docker compose -f docker-compose.yaml -f docker-compose.supersync.yaml up -d --build supersync webdav-e2e
            echo "⏳ Waiting for SuperSync server..."
            timeout 180 sh -c 'until curl -s http://localhost:1901/health > /dev/null 2>&1; do sleep 1; done'
            echo "✓ SuperSync server ready!"
            chmod +x ./scripts/wait-for-webdav.sh
            ./scripts/wait-for-webdav.sh

      - name: Run SuperSync E2E Tests
        env:
          E2E_REQUIRE_SUPERSYNC: 'true'
          E2E_REQUIRE_WEBDAV: 'true'
          # via env, not interpolated into the script, so a quote in the filter can't break the shell
          E2E_GREP: ${{ inputs.grep || '@supersync' }}
        run: npm run e2e:all -- --grep "$E2E_GREP" --shard=${{ matrix.shard }}/6

      - name: Print Docker Logs on Failure
        if: ${{ failure() }}
        run: |
          # Bounded on purpose: the container runs with NODE_ENV=development, so Prisma
          # logs every query. An unbounded dump was ~13k lines and pushed the Playwright
          # failure out of the log tail the GitHub API and `gh run view --log-failed`
          # return, leaving the actual failure unreadable.
          echo "=== SuperSync Logs (last 400 lines per container) ==="
          docker compose -f docker-compose.yaml -f docker-compose.supersync.yaml logs --tail=400 supersync webdav-e2e
          # The tail above is mostly Prisma query noise; a transaction failure
          # (e.g. "Transaction serialization failure for user ...") can sit
          # minutes before the end and never make the cut. Surface every
          # server WARN/ERROR separately so the failing request is nameable.
          echo "=== SuperSync WARN/ERROR lines (last 200) ==="
          docker compose -f docker-compose.yaml -f docker-compose.supersync.yaml logs --no-log-prefix supersync \
            | grep -E '\[(WARN|ERROR)\]' | tail -n 200 || true

      - name: Stop Docker Services
        if: always()
        run: |
          docker compose -f docker-compose.yaml -f docker-compose.supersync.yaml down

      - name: Upload E2E Results on Failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-results-supersync-${{ matrix.shard }}-${{ github.run_id }}
          path: .tmp/e2e-test-results/**/*.*
          retention-days: 30

  # Job 4: SuperSync Server Unit Tests (runs in parallel with build, no artifact needed)
  supersync-server-tests:
    name: SuperSync Server Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: 'npm'
      - name: Reconfigure git to use HTTP authentication
        run: >
          git config --global url."https://github.com/".insteadOf
          ssh://git@github.com/
      - name: Install npm Packages
        run: npm i
      - name: Run SuperSync Server Tests
        run: cd packages/super-sync-server && npm test

  # Job 5: Released-client compatibility. Desktop installs have no auto-updater,
  # so published releases stay in the fleet. These specs run the unmodified web
  # bundles of the releases they were written against (pinned by APK digest in
  # scripts/fetch-released-client-assets.sh) with the current build and server.
  # Without the bundles they skip, which is what the SuperSync shards report.
  e2e-released-clients:
    name: E2E Tests (Released Clients)
    needs: [build]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_released_clients }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UNSPLASH_KEY: ${{ secrets.UNSPLASH_KEY }}
      UNSPLASH_CLIENT_ID: ${{ secrets.UNSPLASH_CLIENT_ID }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup E2E Environment
        uses: ./.github/actions/setup-e2e

      - name: Download Build Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          name: e2e-build-${{ github.run_id }}
          path: .tmp/angular-dist

      - name: Fetch Released Client Bundles
        run: ./scripts/fetch-released-client-assets.sh .tmp/released-clients v19.1.0 v19.0.1 v18.14.0

      - name: Create .env file for Docker Compose
        run: |
          cp .env.example .env

      - name: Start SuperSync Docker Service
        # Retry to survive transient Docker Hub pull timeouts / rate limits;
        # timeout_minutes also bounds the otherwise-unbounded health-wait loop
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3
        with:
          timeout_minutes: 12
          max_attempts: 3
          retry_wait_seconds: 20
          command: |
            docker compose -f docker-compose.yaml -f docker-compose.supersync.yaml up -d --build supersync
            until curl -s http://localhost:1901/health > /dev/null 2>&1; do sleep 1; done

      # Both test steps fail unless at least one test ran and none was skipped: a
      # spec that stops receiving its bundle skips silently, which is how this
      # coverage went missing before.

      # v19.1.0 clients against the current build: the `@supersync released` suites.
      - name: Run Released-Client E2E Tests (v19.1.0)
        id: released-e2e
        env:
          E2E_REQUIRE_SUPERSYNC: 'true'
          COMPAT_OLD_ASSETS: ${{ github.workspace }}/.tmp/released-clients/v19.1.0
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: .tmp/e2e-test-results/released-clients.xml
        run: |
          npx playwright test --config e2e/playwright.config.ts --reporter=line,junit --grep "@supersync released"
          grep -Eq '^<testsuites [^>]* tests="[1-9][0-9]*" [^>]*skipped="0" ' "$PLAYWRIGHT_JUNIT_OUTPUT_FILE" || { echo "::error::Released-client tests were skipped or none ran"; exit 1; }

      # v18.14.0 -> v19.0.1 upgrade against the current server (#9962). It uses
      # no current build, so its config skips global setup; the spec accepts only
      # a loopback server URL. Runs even when the step above failed.
      - name: Run Released-Client Upgrade E2E Tests (v18.14.0 to v19.0.1)
        if: ${{ !cancelled() && steps.released-e2e.conclusion != 'skipped' }}
        env:
          COMPAT_OLD_ASSETS: ${{ github.workspace }}/.tmp/released-clients/v18.14.0
          COMPAT_NEW_ASSETS: ${{ github.workspace }}/.tmp/released-clients/v19.0.1
          SUPERSYNC_E2E_URL: http://127.0.0.1:1901
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: .tmp/e2e-test-results/released-client-upgrade.xml
        run: |
          npx playwright test --config e2e/playwright.compatibility.config.ts --reporter=line,junit
          grep -Eq '^<testsuites [^>]* tests="[1-9][0-9]*" [^>]*skipped="0" ' "$PLAYWRIGHT_JUNIT_OUTPUT_FILE" || { echo "::error::Released-client tests were skipped or none ran"; exit 1; }

      - name: Print Docker Logs on Failure
        if: ${{ failure() }}
        run: |
          # Bounded for the same reason as in the SuperSync job above.
          echo "=== SuperSync Logs (last 400 lines) ==="
          docker compose -f docker-compose.yaml -f docker-compose.supersync.yaml logs --tail=400 supersync
          echo "=== SuperSync WARN/ERROR lines (last 200) ==="
          docker compose -f docker-compose.yaml -f docker-compose.supersync.yaml logs --no-log-prefix supersync \
            | grep -E '\[(WARN|ERROR)\]' | tail -n 200 || true

      - name: Stop Docker Services
        if: always()
        run: |
          docker compose -f docker-compose.yaml -f docker-compose.supersync.yaml down

      - name: Upload E2E Results on Failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-results-released-clients-${{ github.run_id }}
          path: |
            .tmp/e2e-test-results/**/*.*
            .tmp/compatibility-results/**/*.*
          retention-days: 30
