---
# Hand-written from Harper's ItsPossessive, mid-sentence branch with the
# optional adjective it allows before the noun:
#   a verb or preposition, then `it's`, then an adjective, then a noun
#
# Kept as its own rule because a `sequence` token cannot be made optional
# without also being made repeatable, and "I like it's various colors" is
# common enough to be worth the second file.
#
# The noun slot carries a pattern as well as a tag because Penn and Harper
# disagree about one closed set: `somebody`, `anyone`, `nothing` and the rest
# are `NN` to Penn and `PRON` to Harper, so "it's somebody else's problem" --
# a contraction, not a possessive -- matched a slot Harper reads as a pronoun.
# A token's pattern and tag are both required, so naming the set excludes it.
#
# Harper is Copyright (c) Automattic, Inc. and contributors,
# licensed under the Apache License 2.0.
# https://github.com/Automattic/harper
extends: sequence
message: "Use the possessive `its` here."
level: warning
ignorecase: true
model: harper
action:
  name: replace
  params:
    - "its"
tokens:
  - tag: 'VB[DGNPZ]?|IN'
  - pattern: 'it'
    target: true
  - pattern: "'s"
    target: true
  - tag: 'JJ[RS]?'
  - pattern: '^(?!(?:some|any|every|no)(?:body|one|thing)$).+$'
    tag: 'NNP?S?|CD'
