# https://github.com/Automattic/harper
# A bare `'s` was reading possessives as `has`: "that guy's bit" is a noun,
# and Harper skips it because its tagger says so. A substitution cannot ask for
# a tag, so the `'s` has to follow a pronoun -- "he's bit" still lints, "guy's
# bit" no longer does.
#
#
# The auxiliary set also carries the `be` forms and the unapostrophed
# contractions. Only the `have` forms were here, and every one of this rule's
# twelve missed findings was one of the others: "were gave", "are broke",
# "can be saw", "was began", "being took", "youve ran", "its broke".
# A modal comes free -- "can be saw" has `be` directly before the verb.
#
# `woke` is deliberately not among the pairs. It is the one simple past that
# is also an ordinary adjective after `be`, and with the `be` forms in the
# lookbehind it flagged "being woke to gender discrimination" and "the path
# to becoming woke".
extends: substitution
message: "Use the past participle after a form of `have` or `be`."
level: warning
ignorecase: true
matchcase: true
nonword: true
action:
  name: replace
