---
# Hand-written from Harper's ThereOwn -- the sentence-initial case, which the
# negated token in ThereOwn.yml cannot reach. Nothing precedes the marker, so
# there is no noun to disqualify it.
#
# Harper is Copyright (c) Automattic, Inc. and contributors,
# licensed under the Apache License 2.0.
# https://github.com/Automattic/harper
extends: existence
message: "Did you mean the possessive `their`?"
level: warning
scope: sentence
ignorecase: true
nonword: true
tokens:
  - '^there[^\S\n]*\s[^\S\n]*own\b'
