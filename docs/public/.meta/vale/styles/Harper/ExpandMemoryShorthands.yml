  '(?<=\b1\s{0,2})kB\b': "kilobyte"
  '(?<=\b(?:[02-9]|\d\d+)\s{0,2})kB\b': "kilobytes"
  '(?<=\b1\s{0,2})MB\b': "megabyte"
