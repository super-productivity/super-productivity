# Hand-written from Harper's ExpandMemoryShorthands: prose spells the unit out.
#
# The generated rule keyed on punctuation. Harper's table is a map from the
# abbreviation to the word, singular after `1` and plural after anything else,
# which is why every unit appears twice here.
#
# Matched case-sensitively: `MB` and `mb` are the megabyte, but `Mb` is the
# megabit, and the units differ from each other only by case.
#
# The abbreviations are ordered longest first, so `GiB` is read as the gibibyte
# rather than as a stray `B`.
#
# Harper is Copyright (c) Automattic, Inc. and contributors,
# licensed under the Apache License 2.0.
# https://github.com/Automattic/harper
extends: substitution
message: "Prose usually spells out the unit."
level: suggestion
nonword: true
action:
  name: replace
swap:
  '(?<=\b1\s{0,2})KiB\b': "kibibyte"
  '(?<=\b(?:[02-9]|\d\d+)\s{0,2})KiB\b': "kibibytes"
  '(?<=\b1\s{0,2})MiB\b': "mebibyte"
  '(?<=\b(?:[02-9]|\d\d+)\s{0,2})MiB\b': "mebibytes"
  '(?<=\b1\s{0,2})GiB\b': "gibibyte"
