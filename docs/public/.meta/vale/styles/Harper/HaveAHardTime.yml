  '\bhave\s+extremely\s+hard\s+time\b': "have a extremely hard time"
  '\bhave\s+real\s+hard\s+time\b': "have a real hard time"
  '\bhad\s+hard\s+time\b': "had a hard time"
  '\bhad\s+extremely\s+hard\s+time\b': "had a extremely hard time"
  '\bhad\s+real\s+hard\s+time\b': "had a real hard time"
  '\bhas\s+hard\s+time\b': "has a hard time"
  '\bhas\s+extremely\s+hard\s+time\b': "has a extremely hard time"
  '\bhas\s+real\s+hard\s+time\b': "has a real hard time"
  '\bhaving\s+hard\s+time\b': "having a hard time"
  '\bhaving\s+extremely\s+hard\s+time\b': "having a extremely hard time"
