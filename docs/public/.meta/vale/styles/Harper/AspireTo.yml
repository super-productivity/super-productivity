# `ignorecase` is off deliberately. Harper does not match a capitalised
# `Aspire`, and the corpus is full of .NET Aspire -- ".NET Aspire for AWS"
# and the like were 4 false positives, every one a product name. Verified
# against harper-cli: it reports `aspire for` and leaves `Aspire for` alone.
extends: sequence
message: "Use `aspire to` instead of `aspire for`."
level: warning
ignorecase: false
model: harper
matchcase: true
action:
  name: replace
  params:
    - "to"
tokens:
  - pattern: 'aspiring|aspired|aspires|aspire'
  - pattern: 'for'
    target: true
