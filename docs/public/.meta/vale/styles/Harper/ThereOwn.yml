---
# Hand-written from Harper's ThereOwn: `there own` is `their own`.
#
# Harper skips the case where a noun or pronoun comes first, because `there`
# is then an adverb of place and `own` is the verb -- "people there own nice
# cars" is a sentence about what people over there do. The generated rule had
# no such guard and reported both of Harper's own counter-examples.
#
# A negated token cannot match at the start of a sentence, where there is no
# preceding word to reject, so the sentence-initial case is its own rule. The
# contraction forms need no guard at all: Harper flags them anywhere.
#
# Harper is Copyright (c) Automattic, Inc. and contributors,
# licensed under the Apache License 2.0.
# https://github.com/Automattic/harper
extends: sequence
message: "Did you mean the possessive `their`?"
level: warning
ignorecase: true
model: harper
tokens:
  - upos: NOUN|PRON|PROPN
    negate: true
  - pattern: 'there'
    target: true
  - pattern: 'own'
    target: true
