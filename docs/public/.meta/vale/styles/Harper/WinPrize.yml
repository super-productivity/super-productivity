# https://github.com/Automattic/harper
extends: substitution
message: "Perhaps you meant the word for an award."
level: warning
ignorecase: true
matchcase: true
nonword: true
action:
  name: replace
swap:
  '(?<=\b(?:win|wins|won|winning)\s(?:(?:a|an|the|this|that|these|those|my|your|his|her|its|our|their|some|several|many|few|no|any|every|each|first|second|third|two|three|[0-9]+)\s)?)pri[cs]e\b': "prize"
  '(?<=\b(?:win|wins|won|winning)\s(?:(?:a|an|the|this|that|these|those|my|your|his|her|its|our|their|some|several|many|few|no|any|every|each|first|second|third|two|three|[0-9]+)\s)?)pri[cs]es\b': "prizes"
