# Hand-written from Harper's WinPrize: the award is a `prize`.
#
# The generated rule keyed on punctuation. Harper takes a form of `win`, then
# optionally a determiner, then `price`, `prices`, `prise` or `prises` -- the
# verb is what tells an award from a cost, since "the price won" is ordinary.
