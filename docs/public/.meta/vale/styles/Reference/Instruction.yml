# Reference describes; it doesn't advise. "The timeout is 30 seconds", not
# "you should set the timeout". Guidance belongs in a how-to guide. A
# warning is allowed, "you must not apply b unless c", so "must" and
# "never" are not flagged.
# https://diataxis.fr/reference/#the-language-of-reference
extends: existence
message: "'%s' instructs or advises. Reference describes; put the guidance in a how-to guide."
link: https://diataxis.fr/reference/#the-language-of-reference
level: error
ignorecase: true
tokens:
  - you should
  - we recommend
  - it is recommended
  - best practice
  - "it(?:'s| is) a good idea"

tests:
  - name: fires
    input: |
      The timeout is 30 seconds. You should set it higher in production.

    want: |
      1:28:Reference.Instruction:'You should' instructs or advises. Reference describes; put the guidance in a how-to guide.
  - name: clean
    input: |
      The timeout is 30 seconds. The default is 10.

    want: ""
