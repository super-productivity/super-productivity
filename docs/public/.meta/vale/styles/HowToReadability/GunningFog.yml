# Gunning-Fog target for how-to guides. Formula adapted from the Readability
# package (MIT): https://github.com/vale-cli/readability
extends: metric
message: "The how-to Gunning-Fog index is %s. The how-to target is 11."
link: https://en.wikipedia.org/wiki/Gunning_fog_index
level: warning
formula: |
  0.4 * ((words / sentences) + 100 * (complex_words / words))
condition: "> 11"

tests:
  - name: fires
    input: |
      Notwithstanding the aforementioned considerations, the organization's interdepartmental reorganization initiative necessitated comprehensive reevaluation of institutional methodologies and jurisdictional responsibilities.
    want: |
      1:1:HowToReadability.GunningFog:The how-to Gunning-Fog index is 38.31. The how-to target is 11.
  - name: clean
    input: |
      We changed how the teams work. Each team now owns one part of the product.
    want: ""
