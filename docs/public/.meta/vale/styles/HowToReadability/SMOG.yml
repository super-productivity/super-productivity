# SMOG target for how-to guides. Ubuntu's contribution guide sets grade 11
# as the ceiling for both SMOG and Flesch-Kincaid. SMOG needs about 30
# sentences to be stable, so this rule scores the whole page rather than each
# paragraph.
# https://en.wikipedia.org/wiki/SMOG
extends: metric
message: "The how-to SMOG index is %s. The how-to target is grade 11."
link: https://en.wikipedia.org/wiki/SMOG
level: suggestion
scope: text
formula: round(smog, 1)
condition: "> 11"

tests:
  - name: fires
    input: |
      # Probe

      Notwithstanding the aforementioned considerations, the organization's interdepartmental reorganization initiative necessitated comprehensive reevaluation of institutional methodologies and jurisdictional responsibilities.
    want: |
      1:1:HowToReadability.SMOG:The how-to SMOG index is 24.50. The how-to target is grade 11.
  - name: clean
    input: |
      # Probe

      We changed how the teams work. Each team now owns one part of the product.
    want: ""
