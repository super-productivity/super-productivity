# A how-to guide is named for the action it helps the reader perform.
# Start with an imperative verb: "Create a bootable USB stick", not
# "How to create ...", "Creating ...", or "Installation". The "How to" is
# implied by the guide's quadrant.
# https://diataxis.fr/how-to-guides/
extends: existence
message: "Start the title with an imperative verb: 'Create a bootable USB stick'. Do not use 'How to ...' or a gerund such as 'Creating ...'."
link: https://diataxis.fr/how-to-guides/
level: warning
scope: heading.h1
ignorecase: true
nonword: true
tokens:
  - '^how\b'
  - '^(?!bring\b|ping\b|ring\b|sing\b|spring\b|string\b|swing\b|wing\b)\w+ing\b'
  - '^(?:a|an|the|another|this|these|those|your|our|my|their)\s+'
  - '^(?:what|why|when|where|which|who)\b'
  - '^[0-9]'
  - '^(?:installation|configuration|deployment|management|usage|overview|introduction|setup|migration|integration|authentication|authorization|administration|implementation|optimization|maintenance|basics|architecture|comparison|summary|description|documentation|distribution|subscription|registration|recovery|removal|deletion|creation|storage|security|performance|enablement|accessibility|connectivity|compatibility|scalability|reliability|availability|observability|portability|maintainability|usability|infrastructure|virtualization|containerization|orchestration|automation|validation|verification)(?:\s+.*)?$'

