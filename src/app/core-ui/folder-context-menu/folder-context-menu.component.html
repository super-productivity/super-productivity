<!-- The items sit in this template, next to their <mat-menu>: MatMenu's arrow
     keys only reach items written in its own template (#11403). -->
<mat-menu #menu="matMenu">
  <ng-template matMenuContent>
    <button
      mat-menu-item
      (click)="editFolder()"
    >
      <mat-icon>edit</mat-icon>
      <span>{{ T.G.EDIT | translate }}</span>
    </button>

    <button
      mat-menu-item
      (click)="addSubfolder()"
    >
      <mat-icon>create_new_folder</mat-icon>
      <span>{{
        treeKind === MenuTreeKind.PROJECT
          ? (T.F.PROJECT_FOLDER.ADD_SUBFOLDER | translate)
          : (T.F.TAG_FOLDER.ADD_SUBFOLDER | translate)
      }}</span>
    </button>

    @if (treeKind === MenuTreeKind.PROJECT) {
      <button
        mat-menu-item
        (click)="addProject()"
      >
        <mat-icon>add</mat-icon>
        <span>{{ T.F.PROJECT_FOLDER.ADD_PROJECT | translate }}</span>
      </button>
    }

    @if (treeKind === MenuTreeKind.TAG) {
      <button
        mat-menu-item
        (click)="addTag()"
      >
        <mat-icon>add</mat-icon>
        <span>{{ T.F.TAG_FOLDER.ADD_TAG | translate }}</span>
      </button>
    }

    <button
      mat-menu-item
      (click)="deleteFolder()"
    >
      <mat-icon>delete</mat-icon>
      <span>{{ T.G.DELETE | translate }}</span>
    </button>
  </ng-template>
</mat-menu>
