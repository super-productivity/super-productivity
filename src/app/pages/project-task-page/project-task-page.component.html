@if (currentProject()?.isArchived) {
  <div class="archived-notice">
    <span>
      {{
        (currentProject()?.isDone
          ? T.F.PROJECT.COMPLETE.NOTICE
          : T.F.PROJECT.ARCHIVED_NOTICE
        ) | translate
      }}
    </span>
    <button
      mat-button
      (click)="restoreProject()"
    >
      {{
        (currentProject()?.isDone
          ? T.F.PROJECT.COMPLETE.REOPEN
          : T.F.PROJECT.ARCHIVED_PROJECTS.UNARCHIVE
        ) | translate
      }}
    </button>
  </div>
}
<work-view
  [teamOverview]="teamOverview()"
  [teamRows]="taskLists().previews"
  [(onlyMine)]="onlyMine"
  [localSubtaskParents]="taskLists().localSubtaskParents"
  [backlogTasks]="taskLists().backlog"
  [doneTasks]="taskLists().done"
  [isShowBacklog]="isShowBacklog()"
  [undoneTasks]="taskLists().undone"
></work-view>
