<div
  #dropZone
  class="schedule-day-drop-zone"
>
  @if (currentPage(); as current) {
    <swipe-pager
      #pager
      [prev]="prevPage() ?? null"
      [current]="current"
      [next]="nextPage() ?? null"
      [trackKey]="pageKey"
      [isEnabled]="isInBottomSheet && !isDragging()"
      [(isWarm)]="isPagerWarm"
      (navigate)="onPagerNavigate($event)"
    >
      <ng-template
        [swipePagerPage]="current"
        let-page
        let-isCurrent="isCurrent"
      >
        <!-- The bottom sheet covers the task list, so there is nothing to drop -->
        @if (page.hasNoEvents && !isInBottomSheet) {
          <div class="empty-state-anchor">
            <div class="empty-state">
              <div class="empty-state-text">
                {{ T.F.SCHEDULE.DROP_TASKS_HERE_TO_SCHEDULE | translate }}
              </div>
            </div>
          </div>
        }
        <schedule-week
          [isInPanel]="true"
          [events]="page.events"
          [beyondBudget]="page.beyondBudget"
          [daysToShow]="page.daysToShow"
          [todayDateStr]="todayDateStr()"
          [workStartEnd]="workStartEnd() || null"
          [currentTimeRow]="page.day === todayDateStr() ? currentTimeRow() : null"
          [isTaskDragActive]="isCurrent && isDragging()"
          [deadlineTasksByDay]="deadlineTasksByDay()"
        >
          <button
            weekHeaderStart
            mat-icon-button
            [disabled]="page.day === todayDateStr()"
            [attr.aria-label]="T.F.SCHEDULE.PREVIOUS_DAY | translate"
            [matTooltip]="T.F.SCHEDULE.PREVIOUS_DAY | translate"
            (click)="pager.go(-1)"
          >
            <mat-icon>chevron_left</mat-icon>
          </button>
          <button
            weekHeaderEnd
            mat-icon-button
            [attr.aria-label]="T.F.SCHEDULE.NEXT_DAY | translate"
            [matTooltip]="T.F.SCHEDULE.NEXT_DAY | translate"
            (click)="pager.go(1)"
          >
            <mat-icon>chevron_right</mat-icon>
          </button>
        </schedule-week>
      </ng-template>
    </swipe-pager>
  }
</div>
