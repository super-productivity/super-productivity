@if (!isShowAddTask) {
  <div
    style="text-align: center"
    (click)="isShowAddTask = true"
  >
    <!-- Marked so keyboard focus recovery can find THIS button and never a
         button inside the add-task-bar that replaces it while open. -->
    <button
      mat-button
      data-add-task-btn
    >
      <mat-icon>add</mat-icon>
      {{ T.G.ADD | translate }}
    </button>
  </div>
}
@if (isShowAddTask) {
  <add-task-bar
    [isHideTagTitles]="true"
    (closed)="isShowAddTask = false"
    (done)="isShowAddTask = false"
    (afterTaskAdd)="afterTaskAdd.emit($event)"
    [planForDay]="planForDay()"
    [taskIdsToExclude]="taskIdsToExclude()"
    [additionalFields]="additionalFields()"
    [tagsToRemove]="tagsToRemove()"
    [isNoDefaults]="isNoDefaults()"
  ></add-task-bar>
}
