<div
  [@standardList]="$safeNavigationMigration(field.fieldGroup?.length)"
  class="list-wrapper"
>
  @for (
    innerField of field.fieldGroup;
    track trackByFn($index, innerField);
    let i = $index
  ) {
    <div class="row">
      <formly-field
        [field]="innerField"
        class="field"
      ></formly-field>
      <button
        #triggerBtn
        mat-mini-fab
        color=""
        type="button"
        class="remove-btn"
      >
        <mat-icon>more_vert</mat-icon>
      </button>

      <context-menu
        [menu]="contextMenu"
        [rightClickTriggerEl]="triggerBtn"
        [leftClickTriggerEl]="triggerBtn"
      ></context-menu>

      <mat-menu #contextMenu="matMenu">
        <ng-template matMenuContent>
          @if (i > 0) {
            <button
              mat-menu-item
              (click)="moveItem(i, i - 1)"
            >
              <mat-icon>arrow_back</mat-icon>
              {{ T.G.MOVE_BACKWARD | translate }}
            </button>
          }
          @if (i < field.fieldGroup?.length - 1) {
            <button
              mat-menu-item
              (click)="moveItem(i, i + 1)"
            >
              <mat-icon>arrow_forward</mat-icon>
              {{ T.G.MOVE_FORWARD | translate }}
            </button>
          }
          <button
            mat-menu-item
            class="color-warn-i"
            (click)="removeItem(i)"
          >
            <mat-icon class="color-warn-i">delete_forever</mat-icon>
            {{ T.G.DELETE | translate }}
          </button>
        </ng-template>
      </mat-menu>
    </div>
  }
</div>

<div class="footer">
  <button
    (click)="addItem()"
    mat-button
    type="button"
  >
    <mat-icon>add</mat-icon>
    {{ to.addText | translate }}
  </button>
</div>
