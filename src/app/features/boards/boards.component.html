@if (board(); as board) {
  <board
    [boardCfg]="board"
    cdkDropListGroup
  ></board>
} @else if (!boardId()) {
  <div class="no-views">
    <p>{{ T.F.BOARDS.V.NO_VIEWS_MSG | translate }}</p>
    <button
      mat-flat-button
      color="primary"
      (click)="boardsService.createBoard()"
    >
      <mat-icon>add</mat-icon>
      {{ T.F.BOARDS.V.NO_VIEWS_BTN | translate }}
    </button>
  </div>
}
