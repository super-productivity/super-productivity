<h2 mat-dialog-title>
  {{ (data.isCreate ? T.F.BOARDS.V.ADD_NEW_BOARD : T.F.BOARDS.V.EDIT_BOARD) | translate }}
</h2>
<mat-dialog-content>
  @for (hint of data.hints ?? []; track hint) {
    <p>{{ hint | translate }}</p>
  }
  @if (data.board) {
    <board-edit
      #boarEditCmp
      [board]="data.board"
      (afterSave)="close($event)"
    ></board-edit>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button
    (click)="close()"
    mat-button
  >
    {{ T.G.CANCEL | translate }}
  </button>

  @if (!data.isCreate) {
    <button
      (click)="removeBoard()"
      mat-button
      color="warn"
    >
      <mat-icon>delete_forever</mat-icon>
      {{ T.G.DELETE | translate }}
    </button>
  }

  <button
    (click)="save()"
    color="primary"
    mat-flat-button
    type="submit"
  >
    <mat-icon>save</mat-icon>
    {{ T.G.SAVE | translate }}
  </button>
</mat-dialog-actions>
