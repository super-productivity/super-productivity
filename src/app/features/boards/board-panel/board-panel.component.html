<header>
  <div class="title">{{ panelCfg().title | translate }}</div>
  @if (tasks().length) {
    <div class="tasks-total-estimate">
      @if (totalEstimate()) {
        <!-- placeholder hidden: the pipe renders '-' for any sub-minute total -->
        <span>{{ totalEstimate() | msToString: false : true }}</span>
      }
      <mat-icon>task_alt</mat-icon>{{ tasks().length }}
    </div>
  }
  <button
    mat-icon-button
    (click)="editBoard.emit()"
    [attr.aria-label]="T.G.EDIT | translate"
  >
    <mat-icon>edit</mat-icon>
  </button>

  <!--        <button mat-icon-button>-->
  <!--          <mat-icon>more_vert</mat-icon>-->
  <!--        </button>-->
</header>

<add-task-inline
  style="margin-bottom: 8px"
  [additionalFields]="additionalTaskFields()"
  [tagsToRemove]="tagsToRemoveForInlineCreate()"
  [taskIdsToExclude]="panelCfg().taskIds"
  [isNoDefaults]="true"
  (afterTaskAdd)="afterTaskAdd($event)"
></add-task-inline>

<div
  class="task-items"
  cdkDropList
  [cdkDropListData]="tasks()"
  [cdkDropListSortingDisabled]="!isManualOrder()"
  (cdkDropListDropped)="drop($event)"
>
  @for (task of tasks(); track task.id) {
    <planner-task
      cdkDrag
      [cdkDragData]="task"
      [cdkDragStartDelay]="dragDelayForTouch()"
      [task]="task"
      [focusable]="true"
      [cdkDragDisabled]="isMoving() || multiSelect.isTouchSelectionMode()"
      [tagsToHide]="panelCfg().includedTagIds || []"
    >
      @if (task.remindAt) {
        <button
          task-card-trailing
          (click)="scheduleTask(task, $event)"
          [title]="T.F.TASK.CMP.EDIT_SCHEDULED | translate"
          class="ico-btn schedule-btn"
          color=""
          mat-icon-button
        >
          <mat-icon>alarm</mat-icon>
          <div
            class="time-badge"
            [innerHTML]="task.dueWithTime | shortPlannedAt"
          ></div>
        </button>
      }
      @if (task.dueDay) {
        <button
          task-card-trailing
          (click)="scheduleTask(task, $event)"
          [title]="T.F.TASK.CMP.SCHEDULE | translate"
          class="ico-btn schedule-btn"
          color=""
          mat-icon-button
        >
          <mat-icon>today</mat-icon>
          <div class="time-badge">{{ task.dueDay | localDateStr }}</div>
        </button>
      }
    </planner-task>
  }

  <!--  @if (tasks().length === 0) {-->
  <!--    <div class="empty">{{ T.F.PLANNER.NO_TASKS | translate }}</div>-->
  <!--  }-->
</div>
