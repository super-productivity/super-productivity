<!--
  The row fills the whole host, so on touch platforms MatTooltip's inline
  `touch-action: none` would stop any swipe starting on it from scrolling the
  list (#11100, same as #10015). Hover tooltips are unaffected.
-->
<div
  (click)="editTaskRepeatCfg()"
  [matTooltip]="nextDueTooltip()"
  matTooltipTouchGestures="off"
>
  <mat-icon>repeat</mat-icon>
  <div class="wrap">
    <div class="title">{{ repeatCfg().title }}</div>
    <tag-list
      class="planner-tag-list-shared"
      [task]="repeatCfg()"
    ></tag-list>
  </div>
  <div class="info">
    @if (repeatCfg().isPaused) {
      <mat-icon class="paused-icon">pause</mat-icon>
    }
    {{ repeatInfoText() }}
  </div>
</div>
