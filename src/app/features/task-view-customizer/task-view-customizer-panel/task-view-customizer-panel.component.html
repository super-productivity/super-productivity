<!-- TODO remove copypasting -->
<mat-menu
  #customizerMenu="matMenu"
  class="customizer-menu"
>
  <!-- Sort By -->
  <button
    mat-menu-item
    [matMenuTriggerFor]="sortMenu"
  >
    <mat-icon>sort</mat-icon>
    <span>{{ T.F.TASK_VIEW.CUSTOMIZER.SORT | translate }}</span>
    @if (selectedSort()?.type) {
      <span class="current-value">
        {{ selectedSort()!.label | translate }}
      </span>
    }
  </button>

  <!-- Group By: lists only (a view's sections are edited in the editor) -->
  @if (!view()) {
    <button
      mat-menu-item
      [matMenuTriggerFor]="groupMenu"
    >
      <mat-icon>group_work</mat-icon>
      <span>{{ T.F.TASK_VIEW.CUSTOMIZER.GROUP_BY | translate }}</span>
      @if (customizerService.selectedGroup().type) {
        <span class="current-value">
          {{ customizerService.selectedGroup().label | translate }}
        </span>
      }
    </button>
  }

  <!-- Filter By -->
  <button
    mat-menu-item
    [matMenuTriggerFor]="filterMenu"
  >
    <mat-icon>filter_alt</mat-icon>
    <span>{{ T.F.TASK_VIEW.CUSTOMIZER.FILTER_BY | translate }}</span>
    @if (!view() && customizerService.selectedFilter().type) {
      <span class="current-value">
        {{ customizerService.selectedFilter().label | translate }}
      </span>
    }
  </button>

  <!-- Lists only: "Reset all" would wipe a view's own scope -->
  @if (!view()) {
    <mat-divider></mat-divider>

    <!-- Also while Views are off: saving one turns them on -->
    <button
      mat-menu-item
      (click)="saveAsView()"
    >
      <mat-icon>bookmark_add</mat-icon>
      <span>{{ T.F.BOARDS.V.SAVE_AS_VIEW | translate }}</span>
    </button>

    <!-- Reset All -->
    <button
      mat-menu-item
      (click)="onResetAll()"
    >
      <mat-icon>refresh</mat-icon>
      <span>{{ T.F.TASK_VIEW.CUSTOMIZER.RESET_ALL | translate }}</span>
    </button>
  }
</mat-menu>

<!-- Sort submenu -->
<mat-menu #sortMenu="matMenu">
  @for (opt of OPTIONS.sort.list; track opt.type) {
    <button
      mat-menu-item
      (click)="onSortSelect(opt)"
      [class.active]="selectedSort()?.type === opt.type"
    >
      <span class="menu-item-content">
        <span>{{ opt.label | translate }}</span>
        @if (selectedSort()?.type === opt.type) {
          @if (opt.type) {
            <mat-icon class="check-icon">
              {{
                selectedSort()!.order === OPTIONS.sort.order.ASC
                  ? 'arrow_downward'
                  : 'arrow_upward'
              }}
            </mat-icon>
          } @else {
            <mat-icon class="check-icon">check</mat-icon>
          }
        }
      </span>
    </button>
  }

  @if (!view()) {
    <mat-divider></mat-divider>

    <button
      mat-menu-item
      (click)="customizerService.saveSort()"
      [disabled]="customizerService.selectedSort().type === DEFAULT.sort.type"
    >
      <span class="menu-item-content">
        <mat-icon class="check-icon">save</mat-icon>

        <span>{{ T.F.TASK_VIEW.CUSTOMIZER.SAVE_SORT | translate }}</span>
      </span>
    </button>
  }
</mat-menu>

<!-- Group submenu -->
<mat-menu #groupMenu="matMenu">
  @for (opt of customizerService.availableGroupOptions(); track opt.type) {
    <button
      mat-menu-item
      (click)="customizerService.setGroup(opt)"
      [class.active]="customizerService.selectedGroup().type === opt.type"
    >
      <span class="menu-item-content">
        <span>{{ opt.label | translate }}</span>
        @if (customizerService.selectedGroup().type === opt.type) {
          <mat-icon class="check-icon">check</mat-icon>
        }
      </span>
    </button>
  }
</mat-menu>

<!-- Filter submenu -->
<mat-menu #filterMenu="matMenu">
  @if (!view()) {
    <button
      mat-menu-item
      (click)="onFilterSelect(DEFAULT.filter)"
      [class.active]="!customizerService.selectedFilter().type"
    >
      <span class="menu-item-content">
        <span>{{ T.F.TASK_VIEW.CUSTOMIZER.FILTER_DEFAULT | translate }}</span>
        @if (!customizerService.selectedFilter().type) {
          <mat-icon class="check-icon">check</mat-icon>
        }
      </span>
    </button>
  }

  <button
    mat-menu-item
    [matMenuTriggerFor]="filterTagMenu"
    [class.active]="!!activeFilters().tag"
    [disabled]="!!differingFilterTypes().tag"
  >
    <span class="menu-item-content">
      <span>{{ T.F.TASK_VIEW.CUSTOMIZER.FILTER_TAG | translate }}</span>
      @if (differingFilterTypes().tag) {
        <span class="current-value">
          {{ T.F.BOARDS.V.FILTER_DIFFERS_PER_SECTION | translate }}
        </span>
      } @else if (activeFilters().tag) {
        <mat-icon class="check-icon">check</mat-icon>
      }
    </span>
  </button>

  <!-- Lists only: one op per keystroke on a view, whose editor picks projects -->
  @if (!view()) {
    <button
      mat-menu-item
      [matMenuTriggerFor]="filterProjectMenu"
      [class.active]="!!activeFilters().project"
    >
      <span class="menu-item-content">
        <span>{{ T.F.TASK_VIEW.CUSTOMIZER.FILTER_PROJECT | translate }}</span>
        @if (activeFilters().project) {
          <mat-icon class="check-icon">check</mat-icon>
        }
      </span>
    </button>
  }

  <button
    mat-menu-item
    [matMenuTriggerFor]="filterScheduledDateMenu"
    [class.active]="!!activeFilters().scheduledDate"
    [disabled]="!!differingFilterTypes().scheduledDate"
  >
    <span class="menu-item-content">
      <span>{{ T.F.TASK_VIEW.CUSTOMIZER.FILTER_SCHEDULED_DATE | translate }}</span>
      @if (differingFilterTypes().scheduledDate) {
        <span class="current-value">
          {{ T.F.BOARDS.V.FILTER_DIFFERS_PER_SECTION | translate }}
        </span>
      } @else if (activeFilters().scheduledDate) {
        <mat-icon class="check-icon">check</mat-icon>
      }
    </span>
  </button>

  <button
    mat-menu-item
    [matMenuTriggerFor]="filterDeadlineMenu"
    [class.active]="!!activeFilters().deadline"
    [disabled]="!!differingFilterTypes().deadline"
  >
    <span class="menu-item-content">
      <span>{{ T.F.TASK_VIEW.CUSTOMIZER.FILTER_DEADLINE | translate }}</span>
      @if (differingFilterTypes().deadline) {
        <span class="current-value">
          {{ T.F.BOARDS.V.FILTER_DIFFERS_PER_SECTION | translate }}
        </span>
      } @else if (activeFilters().deadline) {
        <mat-icon class="check-icon">check</mat-icon>
      }
    </span>
  </button>

  <button
    mat-menu-item
    [matMenuTriggerFor]="filterEstimatedTimeMenu"
    [class.active]="!!activeFilters().estimatedTime"
    [disabled]="!!differingFilterTypes().estimatedTime"
  >
    <span class="menu-item-content">
      <span>{{ T.F.TASK_VIEW.CUSTOMIZER.FILTER_ESTIMATED_TIME | translate }}</span>
      @if (differingFilterTypes().estimatedTime) {
        <span class="current-value">
          {{ T.F.BOARDS.V.FILTER_DIFFERS_PER_SECTION | translate }}
        </span>
      } @else if (activeFilters().estimatedTime) {
        <mat-icon class="check-icon">check</mat-icon>
      }
    </span>
  </button>

  <button
    mat-menu-item
    [matMenuTriggerFor]="filterTimeSpentMenu"
    [class.active]="!!activeFilters().timeSpent"
    [disabled]="!!differingFilterTypes().timeSpent"
  >
    <span class="menu-item-content">
      <span>{{ T.F.TASK_VIEW.CUSTOMIZER.FILTER_TIME_SPENT | translate }}</span>
      @if (differingFilterTypes().timeSpent) {
        <span class="current-value">
          {{ T.F.BOARDS.V.FILTER_DIFFERS_PER_SECTION | translate }}
        </span>
      } @else if (activeFilters().timeSpent) {
        <mat-icon class="check-icon">check</mat-icon>
      }
    </span>
  </button>

  <button
    mat-menu-item
    [matMenuTriggerFor]="filterPriorityMenu"
    [class.active]="!!activeFilters().priority"
    [disabled]="!!differingFilterTypes().priority"
  >
    <span class="menu-item-content">
      <span>{{ T.F.TASK_VIEW.CUSTOMIZER.FILTER_PRIORITY | translate }}</span>
      @if (differingFilterTypes().priority) {
        <span class="current-value">
          {{ T.F.BOARDS.V.FILTER_DIFFERS_PER_SECTION | translate }}
        </span>
      } @else if (activeFilters().priority) {
        <mat-icon class="check-icon">check</mat-icon>
      }
    </span>
  </button>
</mat-menu>

<!-- Filter: Tag submenu -->
<mat-menu #filterTagMenu="matMenu">
  <button
    mat-menu-item
    (click)="onFilterInputChange(OPTIONS.filter.types.tag, FILTER_COMMON.NOT_SPECIFIED)"
  >
    <span class="menu-item-content">
      <span>{{ T.F.TASK_VIEW.CUSTOMIZER.FILTER_NOT_SPECIFIED | translate }}</span>
      @if (activeFilters().tag?.preset === FILTER_COMMON.NOT_SPECIFIED) {
        <mat-icon class="check-icon">check</mat-icon>
      }
    </span>
  </button>

  <div
    class="menu-input-wrapper"
    (click)="$event.stopPropagation()"
    (keydown)="$event.stopPropagation()"
  >
    <chip-list-input
      [label]="T.F.TASK_VIEW.CUSTOMIZER.FILTER_TAG | translate"
      [suggestions]="allTags()"
      [model]="tagFilterIds()"
      (addItem)="addTagFilter($event)"
      (removeItem)="removeTagFilter($event)"
    ></chip-list-input>

    @if (tagFilterIds().length >= 2) {
      <div class="tag-filter-mode-toggle">
        <button
          mat-button
          [class.is-active]="tagFilterMode() === 'OR'"
          (click)="setTagFilterMode('OR')"
        >
          {{ T.F.TASK_VIEW.CUSTOMIZER.TAG_FILTER_OR | translate }}
        </button>
        <button
          mat-button
          [class.is-active]="tagFilterMode() === 'AND'"
          (click)="setTagFilterMode('AND')"
        >
          {{ T.F.TASK_VIEW.CUSTOMIZER.TAG_FILTER_AND | translate }}
        </button>
      </div>
    }
  </div>
</mat-menu>

<!-- Filter: Project submenu -->
<mat-menu #filterProjectMenu="matMenu">
  <div
    class="menu-input-wrapper"
    (click)="$event.stopPropagation()"
  >
    <mat-form-field
      class="menu-input"
      subscriptSizing="dynamic"
    >
      <input
        matInput
        [ngModel]="activeFilters().project?.preset ?? ''"
        (ngModelChange)="onFilterInputChange(OPTIONS.filter.types.project, $event)"
        [placeholder]="T.F.TASK_VIEW.CUSTOMIZER.ENTER_PROJECT | translate"
        (keydown.enter)="$event.stopPropagation()"
      />
    </mat-form-field>
  </div>
</mat-menu>

<!-- Filter: Scheduled Date submenu -->
<mat-menu #filterScheduledDateMenu>
  <task-view-customizer-menu-item
    [type]="OPTIONS.filter.types.scheduledDate"
    [options]="PRESETS.schedule"
    [selectedFilter]="activeFilters().scheduledDate ?? DEFAULT.filter"
    (byClick)="onFilterWithValue($event)"
  />
</mat-menu>
