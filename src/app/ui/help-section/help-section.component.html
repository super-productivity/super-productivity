@if (isShowHelp()) {
  <div
    [@expandFade]
    class="help-text"
  >
    <ng-content></ng-content>
    @if (docsUrl(); as url) {
      <a
        class="docs-link"
        [href]="url"
        target="_blank"
        rel="noopener"
        >{{ T.G.HELP_READ_GUIDE | translate
        }}<mat-icon aria-hidden="true">open_in_new</mat-icon></a
      >
    }
  </div>
}
