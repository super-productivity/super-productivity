<div
  #wrapperEl
  [class.isHideOverflow]="isHideOverflow()"
  class="markdown-wrapper"
  spResolveClipboardImages
>
  @if (isLiveMarkdownEditor()) {
    <!--
      Always mounted: the live editor is both the read and the edit view, so
      there is no preview to toggle against. Lazy chunk on purpose — CodeMirror
      is ~89kB transfer, kept out of the initial bundle and off the critical
      path for anyone who never opens a note (#9910).
    -->
    @defer (on immediate) {
      <!-- A different task needs a fresh undo history, even if its notes match. -->
      @for (id of [taskId()]; track id) {
        <live-markdown-editor
          #liveEditorEl
          [model]="modelCopy() ?? ''"
          [placeholderTxt]="placeholderTxt() ?? ''"
          [autoFocus]="isLock() || isPendingLiveFocus()"
          [resolveImageSrc]="resolveImageSrc"
          [extraKeymap]="liveEditorKeymap"
          (changed)="onLiveEditorChanged($event)"
          (docChanged)="onLiveEditorDocChanged($event)"
          (focused)="onLiveEditorFocused()"
          (blurred)="onLiveEditorBlurred()"
          (pasted)="pasteHandler($event)"
        ></live-markdown-editor>
      }
    }
  } @else if (isShowEdit() || !isMarkdownFormattingEnabled()) {
    <textarea
      #textareaEl
      (blur)="untoggleShowEdit(); setBlur($event)"
      (focus)="setFocus($event)"
      (input)="resizeTextareaToFit()"
      (keydown)="keypressHandler($event)"
      (keypress)="keypressHandler($event)"
      (paste)="pasteHandler($event)"
      [@fadeIn]
      [ngModel]="modelCopy()"
      [placeholder]="placeholderTxt() ?? ''"
      class="mat-body-2 markdown-unparsed"
      rows="1"
    ></textarea>
  }
</div>

@if (isShowControls()) {
  <div class="controls">
    <ng-content> </ng-content>

    @if (isShowChecklistToggle() && isMarkdownFormattingEnabled()) {
      <!--  -->
      <button
        [matTooltip]="T.F.NOTE.D_FULLSCREEN.TOOLBAR.TASK_LIST | translate"
        (mousedown)="$event.preventDefault()"
        (click)="toggleChecklistMode($event)"
        mat-icon-button
      >
        <mat-icon>checklist</mat-icon>
      </button>
    }
    @if (isCurrentlyChecklist()) {
      <button
        [matTooltip]="T.F.TASK.ADDITIONAL_INFO.CHECKLIST_ACTIONS | translate"
        [matMenuTriggerFor]="checklistMenu"
        (mousedown)="$event.preventDefault()"
        mat-icon-button
      >
        <mat-icon>playlist_add_check</mat-icon>
      </button>
      <mat-menu #checklistMenu="matMenu">
        <button
          (click)="checkAllChecklistItems()"
          mat-menu-item
        >
          <mat-icon>done_all</mat-icon>
          {{ T.F.TASK.ADDITIONAL_INFO.CHECK_ALL | translate }}
        </button>
        <button
          (click)="uncheckAllChecklistItems()"
          mat-menu-item
        >
          <mat-icon>remove_done</mat-icon>
          {{ T.F.TASK.ADDITIONAL_INFO.UNCHECK_ALL | translate }}
        </button>
        <button
          (click)="clearCompletedChecklistItems()"
          mat-menu-item
        >
          <mat-icon>delete_sweep</mat-icon>
          {{ T.F.TASK.ADDITIONAL_INFO.CLEAR_COMPLETED | translate }}
        </button>
      </mat-menu>
    }
    <button
      [matTooltip]="T.F.TASK.ADDITIONAL_INFO.OPEN_IN_FULLSCREEN | translate"
      (mousedown)="$event.preventDefault()"
      (click)="openFullScreen()"
      mat-icon-button
    >
      <mat-icon>fullscreen</mat-icon>
    </button>
  </div>
}
