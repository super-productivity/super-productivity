<div
  (click)="onHeaderClick($event)"
  (keydown)="onHeaderKeydown($event)"
  class="collapsible-header"
  tabindex="0"
  role="button"
  [attr.aria-expanded]="isExpanded"
  [attr.aria-controls]="isExpanded ? panelId : null"
>
  @if (isIconBefore()) {
    <mat-icon class="collapsible-expand-icon">expand_more</mat-icon>
  }
  @if (icon) {
    <mat-icon class="collapsible-additional-icon">{{ icon }} </mat-icon>
  }
  <ng-content select="[before-title]"></ng-content>

  @if (isTitleDragHandle()) {
    <div
      class="collapsible-title is-drag-handle"
      cdkDragHandle
    >
      {{ title() }}<ng-container [ngTemplateOutlet]="countTpl"></ng-container>
    </div>
  } @else {
    <div class="collapsible-title">
      {{ title() }}<ng-container [ngTemplateOutlet]="countTpl"></ng-container>
    </div>
  }

  <ng-template #countTpl>
    @if (count() !== undefined) {
      <span class="collapsible-count">{{ count() }}</span>
    }
  </ng-template>

  <ng-content select="[actions]"></ng-content>

  @if (!isIconBefore()) {
    <mat-icon class="collapsible-expand-icon">expand_more</mat-icon>
  }
</div>

@if (isExpanded) {
  <div
    [@expand]
    class="collapsible-panel ani-expand-collapse"
    [attr.id]="panelId"
  >
    <ng-content></ng-content>
  </div>
}
