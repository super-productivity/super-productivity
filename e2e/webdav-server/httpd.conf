ServerRoot "/usr/local/apache2"
ServerName localhost
Listen 2345

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule authn_core_module modules/mod_authn_core.so
LoadModule authn_file_module modules/mod_authn_file.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_user_module modules/mod_authz_user.so
LoadModule auth_basic_module modules/mod_auth_basic.so
LoadModule headers_module modules/mod_headers.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule dav_module modules/mod_dav.so
LoadModule dav_fs_module modules/mod_dav_fs.so
# Readiness checks GET the root collection; mod_dav serves no GET for folders.
LoadModule autoindex_module modules/mod_autoindex.so

User daemon
Group daemon
ErrorLog /proc/self/fd/2
LogLevel warn

DavLockDB /dav-lock/DavLock
# Mtime ETags turn weak for a second after each write, and the app sends no
# If-Match for weak tags. Content digests stay strong.
FileETag Digest
DocumentRoot "/dav-data"

# The app runs on another origin; echo what the browser asks for.
Header always set Access-Control-Allow-Origin "*"
Header always set Access-Control-Allow-Methods "GET, HEAD, PUT, DELETE, OPTIONS, PROPFIND, PROPPATCH, MKCOL, COPY, MOVE"
Header always set Access-Control-Allow-Headers "expr=%{req:Access-Control-Request-Headers}"
Header always set Access-Control-Expose-Headers "*"

# Answer CORS preflights before auth: browsers send them without credentials.
RewriteEngine On
RewriteCond %{REQUEST_METHOD} OPTIONS
RewriteCond %{HTTP:Access-Control-Request-Method} !^$
RewriteRule ^ - [R=204,L]

<Directory "/dav-data">
  Dav On
  Options Indexes
  AuthType Basic
  AuthName "e2e"
  AuthUserFile /usr/local/apache2/conf/e2e.htpasswd
  Require valid-user
</Directory>
