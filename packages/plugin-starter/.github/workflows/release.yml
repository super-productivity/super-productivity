# Push a tag like v1.0.0 (matching "version" in manifest.json) and this
# workflow attaches plugin.zip to a GitHub release. The release notes contain
# the SHA-256 that a community-plugins.json listing needs.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 22

      - name: Check tag matches manifest version
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest.json version $VERSION" >&2
            exit 1
          fi

      - name: Pack
        run: node scripts/pack.mjs | tee pack.log

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(sed -n 's/^sha256: //p' pack.log)
          gh release create "$GITHUB_REF_NAME" plugin.zip \
            --title "$GITHUB_REF_NAME" \
            --notes "Install: download plugin.zip, then Super Productivity → Settings → Plugins → Choose Plugin File. sha256: \`$SHA\`"
