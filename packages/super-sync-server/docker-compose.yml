# Production docker-compose for super-sync-server
#
# Usage:
#   1. Copy env.example to .env and configure your settings
#   2. Run: ./scripts/deploy.sh
#   3. View logs: docker-compose logs -f
#
# For local builds (development):
#   ./scripts/deploy.sh --build

x-logging: &default-logging
  driver: 'json-file'
  options:
    max-size: '10m'
    max-file: '3'

# Preserve about a day of app history at incident volume (~300 MB), without
# applying the same 10x increase to Postgres and Caddy. (#9191)
x-logging-app: &app-logging
  driver: 'json-file'
  options:
    max-size: '10m'
    max-file: '30'

services:
  supersync:
    # Only `latest` and `master-<sha>` are published, both built from master — there
    # are no release tags. Pin SUPERSYNC_IMAGE to a master-<sha> for a fixed version.
    image: ${SUPERSYNC_IMAGE:-ghcr.io/super-productivity/supersync:latest}
    container_name: supersync-server
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=1900
      - HOST=${HOST:-0.0.0.0}
      # Prisma sizes its default pool from host CPUs, not the container limit.
      # Overriding DATABASE_URL replaces these bounds; carry them across. The
      # migrator rejects missing/invalid bounds before a production deploy. A
      # global statement_timeout remains opt-in because the legacy snapshot-clock
      # scan can legitimately exceed 60s on upgraded histories. See env.example.
      # (#9191)
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-supersync}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-supersync}?connection_limit=60&pool_timeout=10}
      - RUN_MIGRATIONS_ON_STARTUP=${RUN_MIGRATIONS_ON_STARTUP:-false}
      - REQUIRE_DATABASE_POOL_LIMITS=true
      - MIGRATE_RECOVERY_RUNTIME=compose
      - JWT_SECRET=${JWT_SECRET}
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:1900}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://app.super-productivity.com}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - WEBAUTHN_RP_ID=${WEBAUTHN_RP_ID:-localhost}
      # Shown in your users' OS passkey prompt. Defaults to WEBAUTHN_RP_ID when unset.
      - WEBAUTHN_RP_NAME=${WEBAUTHN_RP_NAME:-}
      - WEBAUTHN_ORIGIN=${WEBAUTHN_ORIGIN:-http://localhost:1900}
      # Identify yourself as the data controller to publish /privacy.html. All five are
      # required together; set none and the legal pages are not served at all. Without
      # these lines the container never sees them, however carefully you fill in .env.
      - PRIVACY_CONTACT_NAME=${PRIVACY_CONTACT_NAME:-}
      - PRIVACY_ADDRESS_STREET=${PRIVACY_ADDRESS_STREET:-}
      - PRIVACY_ADDRESS_CITY=${PRIVACY_ADDRESS_CITY:-}
      - PRIVACY_ADDRESS_COUNTRY=${PRIVACY_ADDRESS_COUNTRY:-}
      - PRIVACY_CONTACT_EMAIL=${PRIVACY_CONTACT_EMAIL:-}
      # Optional sections of the policy; omitted entirely when unset.
      - PRIVACY_HOSTING_PROVIDER=${PRIVACY_HOSTING_PROVIDER:-}
      - PRIVACY_SUPERVISORY_AUTHORITY=${PRIVACY_SUPERVISORY_AUTHORITY:-}
      # Region label for the landing page. Only EU/EEA shows the EU-hosting badge.
      - PRIVACY_DATA_REGION=${PRIVACY_DATA_REGION:-}
      - ALLOWED_EMAILS=${ALLOWED_EMAILS:-}
      - SUPERSYNC_DEFAULT_STORAGE_QUOTA_BYTES=${SUPERSYNC_DEFAULT_STORAGE_QUOTA_BYTES:-}
      - OLD_OPS_CLEANUP_DELETE_BATCH_SIZE=${OLD_OPS_CLEANUP_DELETE_BATCH_SIZE:-5000}
      - OLD_OPS_CLEANUP_MAX_DELETED_PER_RUN=${OLD_OPS_CLEANUP_MAX_DELETED_PER_RUN:-25000}
    ports:
      - '127.0.0.1:1900:1900'
    volumes:
      - supersync-data:/app/data
      # To publish your own Terms of Service, uncomment this and put the HTML next to
      # your compose file. The image ships none on purpose — ours name German law, a
      # Leipzig venue and our contact address. Without it, /terms.html is simply not
      # served and the consent notice links only the privacy policy.
      # Deployments driven by scripts/deploy.sh can instead set
      # SUPERSYNC_INSTALL_REPO_TERMS=true in .env to sync legal/terms.html from the
      # checkout into the data volume on every deploy (only if that file is YOURS).
      # - ./legal/terms.html:/app/data/legal/terms.html:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://localhost:1900/health',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # PID 1 is `node`, which reaps only the children it spawned itself.
    # health-alert.sh execs `timeout 18 node -e <probe>` in here every 5 min,
    # and Alpine's timeout is BusyBox, not coreutils: it forks a watchdog and
    # then execs the probe in its own process, so the watchdog outlives the
    # probe, is reparented to PID 1 and is never reaped. One permanent zombie
    # per run — 1058 of them on the hosted server after 3.7 days of uptime,
    # reported by the hoster as PID pressure. docker-init (tini) reaps them and
    # still forwards SIGTERM, so graceful shutdown is unaffected.
    # (caddy is exempt: nothing execs a forking command into it. postgres is
    # NOT — see the `init: true` on that service, #9695.)
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # 200+ WSS clients each consume an fd; Alpine default soft limit (1024)
    # would be tight under reconnect bursts.
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    mem_limit: 768m
    cpus: '1.0'
    networks:
      - internal
    logging: *app-logging

  postgres:
    image: postgres:16-alpine
    container_name: supersync-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-supersync}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-supersync}
    # Tuned for the 1.5g default mem_limit. shared_buffers needs shm_size >
    # default 64m. 120 × 4MB work_mem = 480MB worst-case sort budget + 384MB
    # shared_buffers, inside the 1.5g cap. The cap is deliberately above that
    # anonymous budget: under cgroup v2 the page cache Postgres reaches is
    # charged here too, so mem_limit — not host RAM — bounds how much of the
    # operations heap can stay cached.
    # POSTGRES_MEM_LIMIT and POSTGRES_EFFECTIVE_CACHE_SIZE are ONE decision, and
    # RAISING them is deliberately opt-in. The 2026-08-25 outage showed a bigger
    # cache helps a large heap, but a bigger cap is only safe if the host has the
    # RAM to back it: this file is the default for `ghcr.io/.../supersync:latest`,
    # so shipping a 4g-host tuning would give a self-hoster on a 2g VPS a cap at
    # or above their whole host — cgroup containment gone, the HOST OOM killer
    # picking the victim, possibly sshd. Keeping the released values as the
    # default also means updating leaves the resolved config hash unchanged, so
    # `docker compose up -d` does NOT recreate postgres and drop a warm page
    # cache. Raise both in .env together; the hint should be roughly
    # (limit - shared_buffers).
    # Prisma's DEFAULT pool is ~(host_cpu_count × 2),
    # read from host cores NOT the container cpu limit — it is NOT single-digit
    # on this VPS and will silently consume the entire cap. The app MUST bound
    # it via DATABASE_URL ?connection_limit=N (60, set on the DATABASE_URL
    # default above — this comment asserted it for months while the URL carried
    # no such param, #9191). max_connections stays well above N to reserve slots
    # for migrations, psql, the old-ops cleanup job, and the reconnect stampede
    # after an in-place crash recovery.
    command:
      - postgres
      - -c
      - shared_buffers=384MB
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-1GB}
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_connections=120
      - -c
      - random_page_cost=1.1
      - -c
      # 5 min — kill leaked Prisma idle-in-tx, but well above the
      # migrate-deploy.sh 30-min STEP_TIMEOUT for CONCURRENTLY index builds.
      - idle_in_transaction_session_timeout=300000
      - -c
      - wal_compression=on
      - -c
      - huge_pages=off
    shm_size: 256m
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - >
          pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" &&
          psql -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -c "SELECT 1" > /dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Without an init, `postgres` is PID 1 and adopts every orphan in the
    # container. The healthcheck above is CMD-SHELL: ash forks `pg_isready` and
    # exec's `psql` in place, so when a probe exceeds `timeout` and dockerd
    # SIGKILLs the exec process, a still-running `pg_isready` is orphaned,
    # reparented to the postmaster, and exits 2 ("no response") once its own
    # 3s connect timeout expires. The postmaster's CleanupBackend() (same in
    # PG15-17) treats any reaped status other than 0/1 as a backend crash
    # BEFORE checking whether the PID is one of its backends: "server process
    # (PID n) exited with exit code 2 … terminating any other active server
    # processes", a full in-place crash-restart that drops every client. It
    # needs a stall that outlives both docker's 5s and the orphan's own 3s
    # connect window, which is the signature of all 50 crash-restarts on the
    # hosted server (#9695). docker-init adopts the orphan instead; the
    # postmaster only ever reaps its own children again. The psql half of the
    # healthcheck stays: it is what closes the first-run initdb race (see the
    # root docker-compose).
    init: true
    # The image's STOPSIGNAL is SIGINT (fast shutdown): wait for every backend
    # to exit, then write the shutdown checkpoint. The image itself recommends
    # a longer stop timeout than docker's default 10s, after which PID 1 is
    # SIGKILLed and the next start runs crash recovery. Note a recreate stops
    # the OLD container with the OLD container's timeout, so this value only
    # protects stops after the first one that applies it; for that first one
    # run `docker compose stop -t 60 postgres` before `up -d`.
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    mem_limit: ${POSTGRES_MEM_LIMIT:-1536m}
    networks:
      internal:
        aliases:
          # Keep existing .env files with DATABASE_URL=...@db:5432/... working.
          - db
    logging: *default-logging

  caddy:
    image: caddy:2.11-alpine
    container_name: supersync-caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      - DOMAIN=${DOMAIN}
    healthcheck:
      # Use 127.0.0.1, not localhost: Caddy binds the admin API to IPv4
      # 127.0.0.1:2019, but busybox wget resolves `localhost` to ::1 first
      # and gets "connection refused", marking a healthy Caddy unhealthy.
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:2019/config/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - internal
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: 256m
    depends_on:
      - supersync
    logging: *default-logging

volumes:
  supersync-data:
  postgres-data:
  caddy-data:
  caddy-config:

networks:
  internal:
    # Pinned name so docker-compose.monitoring.yml can attach via
    # `external: true` regardless of the COMPOSE_PROJECT_NAME used.
    name: super-sync-server_internal
    driver: bridge
